# Copy to .github/workflows/report-action-status.yml in the repository being observed.
# The Manifest should declare manifest_id="services/api" before publishing its map.
name: Report action status to Scryr
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      # Build trusted Scryr source, never code from the triggering PR.
      # Pin ref to a reviewed Scryr commit before enabling in production.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: scryr-app/scryr-dev
      # Build the Rust CLI from trusted code. Pin a reviewed release SHA in consumers.
      - name: Build scryr CLI
        run: cargo build --locked --release --manifest-path crystal/Cargo.toml -p crystal-cli
      - name: Record completed workflow
        env:
          SCRYR_ENDPOINT: ${{ vars.SCRYR_ENDPOINT }}
          SCRYR_CLERK_ORG_ID: ${{ vars.SCRYR_CLERK_ORG_ID }}
          SCRYR_TOKEN: ${{ secrets.SCRYR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: crystal/target/release/scryr report-action-status --manifest-id services/api
