[project]
name = "scryr-samples"
version = "0.3.0"
description = "Sample architectures for the Scryr manifest package"
requires-python = "==3.14.6"
dependencies = ["scryr"]

[tool.uv]
package = true

[tool.uv.sources]
scryr = { workspace = true }

[tool.setuptools.packages.find]
include = ["samples*"]
