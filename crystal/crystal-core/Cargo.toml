[package]
name = "crystal-core"
version = "0.5.0"
edition = "2024"
publish = false
description = "Shared models, artifact generation, and persistence for Scryr generated manifests."
readme = "../README.md"
license = "MIT"
repository = "https://github.com/scryr-app/scryr-dev"
keywords = ["manifest", "graphql", "architecture", "scryr"]
categories = ["development-tools"]
include = ["Cargo.toml", "README.md", "src/**"]

[dependencies]
toml_edit.workspace = true
chrono.workspace = true
sha2.workspace = true
async-graphql = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libsql = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[lib]
name = "crystal_core"
path = "src/lib.rs"

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
