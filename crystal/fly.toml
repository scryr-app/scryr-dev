app = "scryrsh-crystal"
primary_region = "dfw"

[build]
dockerfile = "Dockerfile"

# Non-secret runtime configuration.
# Keep secrets like CLERK_SECRET_KEY out of this file and set them with:
# `flyctl secrets set CLERK_SECRET_KEY=...`
# Intended public GraphQL endpoint after Fly custom-domain setup:
# `https://graphql.scryr.app/graphql`
# CORS_ALLOWED_ORIGINS lists the exact frontend origins for the deployed map app.
# The current production frontend origin is `https://scryr-map.vercel.app`.
[env]
AUTH_MODE = "clerk"
HOST = "0.0.0.0"
PORT = "8000"
CORS_ALLOWED_ORIGINS = "https://scryr.app,https://scryr-map.vercel.app"
RUST_LOG = "info"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[http_service.concurrency]
type = "requests"
soft_limit = 50
hard_limit = 100

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/ready"
