"""
Logical kind for a generated artifact persisted to storage.
"""
enum ArtifactKind {
	"""
	Generated instance/value output.
	"""
	value
	"""
	Generated schema or type-definition output.
	"""
	schema
}

type BenchmarkResult {
	name: String!
	meanSeconds: Float!
	stddevSeconds: Float!
	medianSeconds: Float!
	runs: Int!
	command: String!
	baselineMeanSeconds: Float
	machine: String!
}

type Block {
	"""
	Stable Manifest identity used to attach operational history.
	"""
	manifestId: String
	"""
	Declared collectors and their current evidence, including waiting placeholders.
	"""
	evidence: [CollectorEvidence!]!
	"""
	Display name for the component (used as the block label).
	"""
	name: String
	"""
	Emoji or small icon string for the component.
	"""
	icon: String
	"""
	Explicit source URL from the component information section.
	"""
	sourceCodeUrl: String
	"""
	Short description of the component.
	"""
	description: String
	"""
	Semver-like version string (e.g. "1.2.3").
	"""
	version: String
	"""
	1-based line number of the manifest assignment in the source file.
	"""
	lineNumber: Int
	"""
	Service classification (e.g. `public_api`, `worker`, `database`).
	"""
	consumerType: String
	"""
	Primary programming language.
	"""
	language: String
	"""
	Web frameworks in use.
	"""
	frameworks: [String!]!
	"""
	Primary deployment target identifier.
	"""
	deployment: String
	"""
	Cloud provider extracted from the deployment tuple.
	"""
	deploymentProvider: String
	"""
	Team responsible for this service.
	"""
	ownerTeam: String
	"""
	Primary authentication mechanism.
	"""
	authType: String
	"""
	Arbitrary tags for categorization and filtering.
	"""
	tags: [String!]!
	"""
	Monitoring and metrics platform.
	"""
	monitoring: String
	"""
	Log aggregation and analysis platform.
	"""
	logAggregation: String
	"""
	Distributed tracing and APM platform.
	"""
	tracing: String
	"""
	Documentation URLs.
	"""
	docs: [String!]!
	"""
	Helpful external links with display name and URL.
	"""
	links: [Link!]!
	"""
	Returns the raw JSON as a string for debugging.
	"""
	rawJsonString: String!
	"""
	Named connections to other components in the graph.
	"""
	connections: [String!]!
	"""
	Infrastructure as Code tooling (terraform, pulumi, cdk, etc.).
	"""
	iacTool: String
	"""
	Maximum number of service replicas.
	"""
	maxReplicas: Int
	"""
	Minimum number of service replicas.
	"""
	minReplicas: Int
}

type CheckResult {
	name: String!
	passed: Boolean!
	diagnostics: [Diagnostic!]!
	durationSeconds: Float!
}

type CollectorEvidence {
	manifestId: String!
	section: EvidenceSection!
	collectorId: String!
	integration: String!
	workspaceId: String!
	state: CollectorState!
	message: String
	updatedAt: DateTime
	freshnessSeconds: Int!
	stale: Boolean!
	outdated: Boolean!
	latest: EvidenceObservation
}

enum CollectorState {
	WAITING
	RUNNING
	READY
	MISSING_TOOL
	INCOMPATIBLE_TOOL
	NEEDS_LOGIN
	ERROR
	CANCELLED
	DISABLED
}

type CoverageResult {
	suite: String!
	covered: Int!
	total: Int!
}

"""
Implement the DateTime<Utc> scalar

The input/output is a string in RFC3339 format.
"""
scalar DateTime

type DependencyEdge {
	from: String!
	to: String!
}

type Diagnostic {
	message: String!
	path: String
	line: Int
	severity: String!
}

type EvidenceObservation {
	schemaVersion: Int!
	observationId: String!
	manifestId: String!
	section: EvidenceSection!
	collectorId: String!
	integration: String!
	workspaceId: String!
	environment: String!
	scope: String!
	planRevision: String!
	collectorRevision: String!
	runId: String!
	attempt: Int!
	observedAt: DateTime!
	"""
	Original source artifact modification time, when importing existing evidence.
	"""
	sourceUpdatedAt: DateTime
	startedAt: DateTime!
	recordedAt: DateTime
	inputFingerprint: String!
	commitSha: String
	branch: String
	dirty: Boolean
	toolVersion: String
	upstreamFingerprint: String
	policyRevision: String
	result: EvidenceResult!
}

union EvidenceResult = GitResult | PullRequestsResult | WorkflowsResult | CheckResult | TestResult | CoverageResult | InventoryResult | LicenseResult | VulnerabilityResult | MetricsResult | BenchmarkResult

enum EvidenceSection {
	REPOSITORY
	CHECKS
	METRICS
	TESTS
	DEPENDENCIES
	PERFORMANCE
}

type GeneratedManifestMutationRoot {
	"""
	Save source and all its diagram artifacts with optimistic concurrency.
	"""
	saveManifestDocument(identifier: String!, revision: String!, envelope: JSON!): JSON!
	"""
	Persist normalized evidence without starting any collector or executing code.
	"""
	recordEvidence(observation: JSON!): Boolean!
	"""
	Persist collector lifecycle status; collection remains owned by the local CLI.
	"""
	recordCollectorStatus(status: JSON!): Boolean!
	"""
	Upsert a generated manifest artifact into storage.
	"""
	upsertGeneratedManifest(input: UpsertGeneratedManifestInput!): UpsertGeneratedManifestPayload!
}

type GitResult {
	branch: String
	commit: String
	dirty: Boolean!
	changedFiles: Int!
	ahead: Int!
	behind: Int!
	remoteUrl: String
}

"""
Health check result exposed over GraphQL and HTTP.
"""
type HealthStatus {
	"""
	Overall service status.
	"""
	status: String!
	"""
	Whether the database query succeeded.
	"""
	databaseOk: Boolean!
	"""
	Details about the database health check result.
	"""
	databaseMessage: String!
}

type InventoryResult {
	complete: Boolean!
	artifactHash: String!
	"""
	Bounded inventory page, filtered over the full immutable snapshot before pagination.
	"""
	packages(limit: Int! = 25, offset: Int! = 0, search: String, filter: String, ids: [String!]): [Package!]!
	matchingPackages(search: String, filter: String, ids: [String!]): Int!
	relationships(limit: Int! = 25, offset: Int! = 0): [DependencyEdge!]!
	totalPackages: Int!
	totalRelationships: Int!
	licensedPackages: Int!
	unknownLicensePackages: Int!
}

"""
A scalar that can represent any JSON value.
"""
scalar JSON

type LicenseFinding {
	packageId: String!
	expression: String
	decision: String!
	reason: String!
}

type LicenseResult {
	policyRevision: String!
	inventoryHash: String!
	complete: Boolean!
	items(limit: Int! = 25, offset: Int! = 0, search: String, filter: String): [LicenseFinding!]!
	matchingItems(search: String, filter: String): Int!
	totalItems: Int!
	allowedCount: Int!
	deniedCount: Int!
	reviewCount: Int!
}

"""
External reference associated with a block (e.g., repo, docs, dashboard).
"""
type Link {
	"""
	Human-readable name for the link target.
	"""
	siteName: String
	"""
	URL of the target resource.
	"""
	httpUrl: String
}

type MetricLabel {
	name: String!
	value: String!
}

type MetricSample {
	name: String!
	title: String
	labels: [MetricLabel!]!
	value: Float!
	unit: String
	metricType: String!
}

type MetricsResult {
	samples: [MetricSample!]!
	scrapedAt: DateTime!
	complete: Boolean!
}

type Package {
	id: String!
	name: String!
	version: String!
	ecosystem: String!
	purl: String
	paths: [String!]!
	licenses: [String!]!
}

type PullRequest {
	number: Int!
	title: String!
	url: String!
	state: String!
	reviewDecision: String
	headRefName: String
	headRefOid: String
}

type PullRequestsResult {
	repository: String!
	items: [PullRequest!]!
	complete: Boolean!
}

type QueryRoot {
	"""
	Read the selected diagram's complete source document.
	"""
	manifestDocument(identifier: String!): JSON!
	"""
	Read passive, immutable collector history scoped to the active organization.
	"""
	evidenceHistory(manifestId: String!, section: EvidenceSection!, collectorId: String!, workspaceId: String!, limit: Int! = 50, offset: Int! = 0): [EvidenceObservation!]!
	"""
	Immutable, organization-scoped observation used for on-demand detail pagination.
	"""
	evidenceObservation(observationId: String!, workspaceId: String): EvidenceObservation
	health: HealthStatus!
	"""
	Lists persisted Scryr maps available in the configured database.
	"""
	scryrMaps: [ScryrMap!]!
	"""
	Loads and returns blocks from generated manifest artifacts in the configured database.
	Pass `scry_identifier` to load an exact Scryr map, or `sample` for legacy lookup.
	"""
	blocks(scryIdentifier: String, sample: String, workspaceId: String): [Block!]!
}

"""
A persisted Scryr map artifact available in storage.
"""
type ScryrMap {
	"""
	Public map identifier used by the UI.
	"""
	id: String!
	"""
	Artifact key used by legacy sample-based lookups.
	"""
	key: String!
	"""
	Stable Scryr identifier, normally the top-level Diagram variable name.
	"""
	scryIdentifier: String!
	"""
	Human-readable map name from the declared Diagram.
	"""
	name: String!
	"""
	Clerk organization id that owns the uploaded manifest.
	"""
	clerkOrgId: String!
	"""
	Clerk organization slug cached from the uploader's active session.
	"""
	orgSlug: String
	"""
	Folder path containing the uploaded manifest file.
	"""
	folderPath: String!
	"""
	Uploaded manifest file name.
	"""
	fileName: String!
	"""
	Git commit SHA associated with the upload, when supplied.
	"""
	gitCommitSha: String
	"""
	Last update timestamp rendered by the database.
	"""
	updatedAt: String!
}

type TestCase {
	name: String!
	suite: String!
	status: String!
	message: String
	durationSeconds: Float!
}

type TestResult {
	suite: String!
	passing: Int!
	failing: Int!
	errors: Int!
	skipped: Int!
	durationSeconds: Float!
	cases: [TestCase!]!
}

"""
A UUID is a unique 128-bit number, stored as 16 octets. UUIDs are parsed as
Strings within GraphQL. UUIDs are used to assign unique identifiers to
entities without requiring a central allocating authority.

# References

* [Wikipedia: Universally Unique Identifier](http://en.wikipedia.org/wiki/Universally_unique_identifier)
* [RFC4122: A Universally Unique Identifier (UUID) URN Namespace](http://tools.ietf.org/html/rfc4122)
"""
scalar UUID

"""
Input payload for upserting a generated manifest artifact.
"""
input UpsertGeneratedManifestInput {
	"""
	Logical artifact kind.
	"""
	artifactKind: ArtifactKind!
	"""
	Persisted manifest artifact key.
	"""
	artifactKey: String!
	"""
	Folder path containing the uploaded manifest file.
	"""
	folderPath: String
	"""
	Uploaded manifest file name.
	"""
	fileName: String
	"""
	Stable Scryr identifier, normally the top-level Diagram variable name.
	"""
	scryIdentifier: String
	"""
	Human-readable map name from the declared Diagram.
	"""
	name: String
	"""
	Git commit SHA associated with the upload, when supplied by the caller.
	"""
	gitCommitSha: String
	"""
	Full generated artifact content.
	"""
	content: String!
}

"""
Payload returned after upserting a generated manifest artifact.
"""
type UpsertGeneratedManifestPayload {
	"""
	Persisted row identifier.
	"""
	id: UUID!
}

type VulnerabilityFinding {
	packageId: String!
	advisoryId: String!
	aliases: [String!]!
	severity: String!
	fixVersions: [String!]!
	url: String
}

type VulnerabilityResult {
	inventoryHash: String!
	databaseAgeSeconds: Int
	databaseVersion: String
	complete: Boolean!
	items(limit: Int! = 25, offset: Int! = 0, search: String, filter: String): [VulnerabilityFinding!]!
	matchingFindings(search: String, filter: String): Int!
	totalFindings: Int!
	affectedPackages: Int!
	criticalCount: Int!
	highCount: Int!
	mediumCount: Int!
	lowCount: Int!
	unknownSeverityCount: Int!
}

type WorkflowRun {
	runId: String!
	attempt: Int!
	name: String!
	status: String!
	conclusion: String
	branch: String!
	commit: String!
	url: String!
	updatedAt: DateTime!
}

type WorkflowsResult {
	repository: String!
	items: [WorkflowRun!]!
	complete: Boolean!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Provides a scalar specification URL for specifying the behavior of custom scalar types.
"""
directive @specifiedBy(url: String!) on SCALAR
schema {
	query: QueryRoot
	mutation: GeneratedManifestMutationRoot
}
