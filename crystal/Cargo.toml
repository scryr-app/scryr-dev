[workspace]
members = ["crystal-core", "crystal-server", "crystal-cli"]
resolver = "3"

[workspace.dependencies]
actix-cors = "0.7"
actix-web = "4.7"
assert_cmd = "2.0"
async-graphql = { version = "7.0", features = ["chrono", "uuid", "url"] }
async-graphql-actix-web = "7.0"
base64 = "0.23.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
clerk-rs = { version = "0.5.0", features = ["actix"] }
crystal-core = { version = "0.3.0", path = "crystal-core" }
crystal-server = { version = "0.3.0", path = "crystal-server" }
futures-util = "0.3"
# Local SQLite is provided by sqlx. Enabling libsql's default embedded engine
# links a second SQLite implementation and causes duplicate symbols on Linux.
libsql = { version = "0.10.0-pre.4", default-features = false, features = ["remote", "tls"] }
predicates = "3.1"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "query", "form"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "sqlite"] }
tempfile = "3.12"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2.5"
uuid = { version = "1.8", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
enum_glob_use = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
inconsistent_struct_constructor = "warn"
unused_self = "warn"
used_underscore_binding = "warn"
redundant_pub_crate = "allow"
multiple_crate_versions = "allow"
future_not_send = "allow"
unused_async = "allow"
