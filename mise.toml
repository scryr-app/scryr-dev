# Shared toolchain and task entrypoints for contributors and GitHub Actions.
# Put cloud credentials in ignored mise.local.toml (see mise.local.toml.example).
[tools]
rust = { version = "1.96.0", profile = "minimal", components = ["rustfmt", "clippy"] }
python = "3.14.6"
uv = "0.11.12"
node = "26.1.0"
watchexec = "2.5.1"

[settings]
python.uv_venv_auto = "create|source"

[env]
UV_CACHE_DIR = "{{config_root}}/.cache/uv"

# What to execute (after mise install):
#   Contribute: mise run contribute:setup, then mise run contribute:oss
#   Verify:     mise run verify (all CI checks); mise run pre-commit also fixes code
#   Release:    mise run release (guide to building, drafting, and distributing)
#   Deploy:     mise run deploy (guide to deploying a validated release tag)
# Component selectors: manifest = Python SDK; crystal = Rust CLI/server; map = Vite UI.
# Public workflows come first; hidden internal:* implementations follow.
# All implementations stay in this file; no aliases or external task scripts.
# Use sequential run calls for ordered operations; depends starts dev processes together.

# Contribution: setup, development, fixes, and local utilities

[tasks."contribute"]
description = "Show the contribute workflow and required commands"
dir = "{{config_root}}"
run = """
cat <<'GUIDE'
Start contributing (run mise install first):
  mise run contribute:setup       Install locked dependencies
  mise run contribute:oss         Develop with local SQLite and auth
  mise run contribute:cloud       Develop with configured Turso and Clerk
  mise run pre-commit             Apply fixes, then run all verification
See CONTRIBUTING.md for credentials, debugging, and targeted tasks.
GUIDE
"""

[tasks."contribute:setup"]
description = "Install locked dependencies for crystal (Rust), manifest (Python), and map (Vite)"
dir = "{{config_root}}"
run = [
  "mise run internal:dependencies:crystal",
  "mise run internal:dependencies:manifest",
  "mise run internal:dependencies:map",
]

[tasks."contribute:oss"]
description = "Contribute with Rust restart, Vite HMR, local SQLite and local auth"
depends = ["contribute:oss:server", "contribute:oss:map"]
dir = "{{config_root}}"

[tasks."contribute:cloud"]
description = "Contribute with Rust restart, Vite HMR, Turso and Clerk"
depends = ["contribute:cloud:server", "contribute:cloud:map"]
dir = "{{config_root}}"

[tasks."pre-commit"]
description = "Apply formatting and lint fixes, then run all verification checks"
dir = "{{config_root}}"
run = ["mise run contribute:fix", "mise run verify"]

[tasks."contribute:fix"]
description = "Apply formatting and auto-fixable lint fixes"
dir = "{{config_root}}"
run = ["mise run contribute:format", "mise run contribute:lint-fix"]

[tasks."contribute:oss:server"]
description = "Watch and restart the oss Rust server"
run = "mise run internal:contribute:process oss watch"
dir = "{{config_root}}"

[tasks."contribute:oss:map"]
description = "Run Vite HMR with oss configuration"
run = "mise run internal:contribute:process oss ui"
dir = "{{config_root}}"

[tasks."contribute:oss:debug"]
description = "Build Rust with symbols and prepare the VS Code environment"
run = "mise run internal:contribute:process oss debug"
dir = "{{config_root}}"

[tasks."contribute:cloud:server"]
description = "Watch and restart the cloud Rust server"
run = "mise run internal:contribute:process cloud watch"
dir = "{{config_root}}"

[tasks."contribute:cloud:map"]
description = "Run Vite HMR with cloud configuration"
run = "mise run internal:contribute:process cloud ui"
dir = "{{config_root}}"

[tasks."contribute:cloud:debug"]
description = "Build Rust with symbols and prepare the VS Code environment"
run = "mise run internal:contribute:process cloud debug"
dir = "{{config_root}}"

[tasks."contribute:cloud:remote-map"]
description = "Run Vite HMR against the deployed Fly API"
run = "mise run internal:contribute:process cloud remote"
dir = "{{config_root}}"

[tasks."contribute:lint-fix"]
description = "Fix auto-fixable Python and TypeScript lint issues"
dir = "{{config_root}}"
run = ["mise run contribute:lint-fix:manifest", "mise run contribute:lint-fix:map"]

[tasks."contribute:lint-fix:manifest"]
description = "Fix auto-fixable Ruff issues"
dir = "{{config_root}}"
run = "cd manifest && uv run ruff check --fix --unsafe-fixes . tests/samples/*/*.scry"

[tasks."contribute:lint-fix:map"]
description = "Fix auto-fixable TypeScript lint issues"
dir = "{{config_root}}"
run = "cd map && npm exec biome -- check --write --unsafe ."

[tasks."contribute:format"]
description = "Format Rust, Python, and TypeScript code"
dir = "{{config_root}}"
run = [
  "mise run contribute:format:crystal",
  "mise run contribute:format:manifest",
  "mise run contribute:format:map",
]

[tasks."contribute:format:crystal"]
description = "Format Rust code"
dir = "{{config_root}}"
run = "cargo fmt --manifest-path crystal/Cargo.toml --all"

[tasks."contribute:format:manifest"]
description = "Format Python code and sample manifests"
dir = "{{config_root}}"
run = "cd manifest && uv run ruff format . tests/samples/*/*.scry"

[tasks."contribute:format:map"]
description = "Format TypeScript code"
dir = "{{config_root}}"
run = "cd map && npm exec biome -- format --write ."

[tasks."contribute:build"]
description = "Build Rust, Python, and frontend artifacts for local development"
dir = "{{config_root}}"
run = [
  "mise run contribute:build:map",
  "mise run contribute:build:manifest",
  "mise run contribute:build:crystal",
]

[tasks."contribute:build:crystal"]
description = "Build the Rust workspace"
dir = "{{config_root}}"
run = "cargo build --locked --manifest-path crystal/Cargo.toml --workspace"

[tasks."contribute:build:manifest"]
description = "Build the Python SDK distribution"
dir = "{{config_root}}"
run = "cd manifest/scryr && uv build --sdist --wheel"

[tasks."contribute:build:map"]
description = "Build the frontend for local development"
dir = "{{config_root}}"
run = "npm --prefix map run build"

[tasks."contribute:seed:samples"]
description = "Upload every sample manifest to the local GraphQL API and SQLite database"
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -eu
export SCRYR_GRAPHQL_URL="http://127.0.0.1:8000/graphql"
export SCRYR_API_TOKEN=windrunner
port=8000
health_url="http://127.0.0.1:${port}/health"
server_log="${TMPDIR:-/tmp}/scryr-sample-upload-server-${port}.log"

if ! curl --silent --show-error --fail "$health_url" >/dev/null 2>&1; then
  (
    HOST=127.0.0.1 PORT="$port" AUTH_MODE=local mise run internal:contribute:oss:serve
  ) >"$server_log" 2>&1 &
  server_pid=$!
  trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

  if ! curl --silent --fail \
    --retry 40 \
    --retry-all-errors \
    --retry-connrefused \
    --retry-delay 1 \
    "$health_url" >/dev/null 2>&1; then
    cat "$server_log" >&2
    exit 1
  fi
fi

for sample in manifest/tests/samples/*/index.scry; do
  sample_name="$(basename "$(dirname "$sample")")"
  cargo run --locked --manifest-path crystal/Cargo.toml -p crystal-cli -- push \
    --path "tests/samples/${sample_name}/index.scry" \
    --manifest-dir manifest \
    --scryr-dir "${SCRYR_DIR:-.cache/scryr}"
done
'''

[tasks."contribute:generate:graphql"]
description = "Generate frontend GraphQL types from the local server"
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -eu
token="${SCRYR_API_TOKEN:-windrunner}"

if ! curl --silent --show-error --fail \
  -H "x-scryr-token: ${token}" \
  -H "content-type: application/json" \
  --data '{"query":"query { __typename }"}' \
  http://127.0.0.1:8000/graphql >/dev/null; then
  (
    HOST=127.0.0.1 PORT=8000 AUTH_MODE=local mise run internal:contribute:oss:serve
  ) >/tmp/scryr-codegen-server.log 2>&1 &
  server_pid=$!
  trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

  curl --silent --show-error --fail \
    --retry 40 \
    --retry-all-errors \
    --retry-connrefused \
    --retry-delay 1 \
    -H "x-scryr-token: ${token}" \
    -H "content-type: application/json" \
    --data '{"query":"query { __typename }"}' \
    http://127.0.0.1:8000/graphql >/dev/null
fi

mise run internal:generate:map
'''

[tasks."contribute:generate:manifest-types"]
description = "Generate manifest field type metadata via the Scryr CLI"
dir = "{{config_root}}"
run = "cargo run --locked --manifest-path crystal/Cargo.toml -p crystal-cli -- inspect types --path tests/samples/open_saas/index.scry --manifest-dir manifest --scryr-dir .cache/scryr"

[tasks."contribute:oss:install"]
description = "Build and install the self-contained scryr CLI on PATH"
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -eu

mise run release:build

install_dir="${SCRYR_CLI_INSTALL_DIR:-$HOME/.local/bin}"
mkdir -p "$install_dir"
tmp_binary="$install_dir/scryr.tmp.$$"
cp crystal/target/release/scryr "$tmp_binary"
chmod +x "$tmp_binary"
mv "$tmp_binary" "$install_dir/scryr"

path_entry="$install_dir"
if [ "$install_dir" = "$HOME/.local/bin" ]; then
  path_entry='$HOME/.local/bin'
fi

shell_name="$(basename "${SHELL:-}")"
case "$shell_name" in
  zsh)
    profile="$HOME/.zshrc"
    path_line="export PATH=\"$path_entry:\$PATH\""
    ;;
  bash)
    if [ "$(uname -s)" = "Darwin" ]; then
      profile="$HOME/.bash_profile"
    else
      profile="$HOME/.bashrc"
    fi
    path_line="export PATH=\"$path_entry:\$PATH\""
    ;;
  fish)
    profile="${XDG_CONFIG_HOME:-$HOME/.config}/fish/config.fish"
    mkdir -p "$(dirname "$profile")"
    path_line="fish_add_path -g \"$install_dir\""
    ;;
  *)
    profile=""
    path_line=""
    ;;
esac

if [ -n "$profile" ]; then
  if ! grep -F "$install_dir" "$profile" >/dev/null 2>&1; then
    printf '\n# Added by scryr-cli setup\n%s\n' "$path_line" >> "$profile"
    echo "Added $install_dir to PATH in $profile"
  else
    echo "$install_dir is already configured in $profile"
  fi
else
  echo "Installed scryr to $install_dir"
  echo "Add this directory to PATH for shell ${SHELL:-unknown}: $install_dir"
fi

echo "Installed $( "$install_dir/scryr" --version ) at $install_dir/scryr"
echo "Restart your shell or run: export PATH=\"$install_dir:\$PATH\""
'''

