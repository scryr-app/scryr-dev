[tasks."release:validate"]
description = "Validate the release tag, main ancestry and versions"
run = "mise run release:process validate"
dir = "{{config_root}}"

[tasks."release:smoke"]
description = "Exercise the standalone binary outside the checkout"
run = '''
#!/usr/bin/env bash
set -euo pipefail
export RUNNER_TEMP="$(mktemp -d)"
trap 'rm -rf "$RUNNER_TEMP"' EXIT
unset SCRYR_SPRITE SCRYR_SPRITE_ORG SCRYR_SPRITE_BIN
unset DATABASE_URL TURSO_DATABASE_URL TURSO_AUTH_TOKEN LIBSQL_AUTH_TOKEN CLERK_SECRET_KEY
export AUTH_MODE=local
export SCRYR_API_TOKEN=windrunner
export SCRYR_DIR="$RUNNER_TEMP/scryr-release"

./crystal/target/release/scryr --version
./crystal/target/release/scryr generate schema \
  --path tests/samples/mern/index.scry \
  --manifest-dir manifest \
  --scryr-dir .cache/scryr-release > "$RUNNER_TEMP/schema.json"
python3 -m json.tool "$RUNNER_TEMP/schema.json" >/dev/null

# Exercise the embedded SDK outside the source workspace.
mkdir -p "$RUNNER_TEMP/standalone/sample"
