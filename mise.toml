run = '''
python - "$usage_mode" "$usage_action" <<'PYTHON'
"""Runtime modes shared by terminals, file watchers, and VS Code."""

import json
import os
import subprocess
import sys
from pathlib import Path

ROOT = Path.cwd()
CLOUD_KEYS = (
    "DATABASE_URL",
    "TURSO_DATABASE_URL",
    "TURSO_AUTH_TOKEN",
    "LIBSQL_AUTH_TOKEN",
    "CLERK_SECRET_KEY",
    "VITE_CLERK_PUBLISHABLE_KEY",
)


def require(*keys):
    missing = [key for key in keys if not os.environ.get(key, "").strip()]
    if missing:
        raise SystemExit(
            "Set these values in mise.local.toml or your environment: "
            + ", ".join(missing)
        )


def environment(mode):
    env = os.environ.copy()
    env.update(
        HOST="127.0.0.1",
        PORT="8000",
        SCRYR_DIR=str(ROOT / ".cache" / mode),
        SCRYR_SQLITE_PATH=str(ROOT / ".cache" / mode / "scryr.db"),
        SCRYR_GRAPHQL_URL="http://127.0.0.1:8000/graphql",
        VITE_GRAPHQL_ENDPOINT="http://127.0.0.1:8000/graphql",
        VITE_DEBUG="true",
        RUST_BACKTRACE="1",
        CORS_ALLOWED_ORIGINS="http://127.0.0.1:3000,http://localhost:3000",
    )
    if mode == "oss":
        for key in CLOUD_KEYS:
            env.pop(key, None)
        env.update(
            AUTH_MODE="local",
            VITE_SCRYR_AUTH_MODE="local",
            SCRYR_API_TOKEN="windrunner",
        )
    else:
        require(
            "TURSO_DATABASE_URL",
            "TURSO_AUTH_TOKEN",
            "CLERK_SECRET_KEY",
            "VITE_CLERK_PUBLISHABLE_KEY",
        )
        env.update(AUTH_MODE="clerk", VITE_SCRYR_AUTH_MODE="clerk")
        env.pop("SCRYR_API_TOKEN", None)
    return env


def main():
    mode, action = sys.argv[1:]
    env = environment(mode)
    cargo = [
        "cargo",
        "run",
        "--locked",
        "--manifest-path",
        "crystal/Cargo.toml",
        "-p",
        "crystal-cli",
        "--",
        "serve",
    ]
    if action == "debug":
        subprocess.run(
            [
                "cargo",
                "build",
                "--locked",
                "--manifest-path",
                "crystal/Cargo.toml",
                "-p",
                "crystal-cli",
            ],
            cwd=ROOT,
            env={**env, "CARGO_PROFILE_DEV_DEBUG": "2"},
            check=True,
        )
        path = ROOT / ".cache" / f"debug-{mode}.env"
        path.parent.mkdir(parents=True, exist_ok=True)
        # Only debugger runtime values, never a dump of unrelated shell secrets.
        keys = {
            *CLOUD_KEYS,
            "HOST",
            "PORT",
            "AUTH_MODE",
            "CORS_ALLOWED_ORIGINS",
            "SCRYR_API_TOKEN",
            "SCRYR_DIR",
            "SCRYR_SQLITE_PATH",
            "RUST_BACKTRACE",
            "PATH",
        }
        with open(
            path, "w", opener=lambda p, flags: os.open(p, flags, 0o600)
        ) as stream:
            stream.writelines(
                f"{key}={json.dumps(env.get(key, ''))}\n" for key in sorted(keys)
            )
        path.chmod(0o600)
        return
    if action in ("ui", "remote"):
        if action == "remote":
            require("CLOUD_GRAPHQL_URL")
            env["VITE_GRAPHQL_ENDPOINT"] = os.environ["CLOUD_GRAPHQL_URL"]
        cmd = [
            "npm",
            "--prefix",
            "map",
            "run",
            "dev",
            "--",
            "--host",
            "127.0.0.1",
            "--strictPort",
        ]
    elif action == "watch":
        # Watch sources explicitly: regenerating embedded assets must not
        # trigger another restart while a build is still preparing those assets.
        watched = [
            "crystal/Cargo.toml",
            "crystal/Cargo.lock",
            "manifest/scryr/src",
            "manifest/scryr/pyproject.toml",
        ]
        for crate in sorted((ROOT / "crystal").glob("crystal-*")):
            for name in ["src", "Cargo.toml", "build.rs"]:
                if (crate / name).exists():
                    watched.append(str((crate / name).relative_to(ROOT)))
        cmd = ["watchexec", "--restart", "--debounce", "300ms"]
        for path in watched:
            cmd.extend(["--watch", path])
        cmd.extend(
            [
                "--",
                "mise",
                "run",
                "run:server:" + ("local" if mode == "oss" else "cloud"),
            ]
        )

    else:
        # Changes to the SDK are reflected in the next Rust restart too.
        subprocess.run(["mise", "run", "sync:embedded-sdk"], cwd=ROOT, check=True)
        cmd = cargo
    os.chdir(ROOT)
    os.execvpe(cmd[0], cmd, env)


if __name__ == "__main__":
    main()
PYTHON
