run = '''
python - "$usage_mode" "$usage_action" <<'PYTHON'
"""Runtime modes shared by terminals, file watchers, and VS Code."""

import json
import os
import subprocess
import sys
from pathlib import Path

ROOT = Path.cwd()
CLOUD_KEYS = (
    "DATABASE_URL",
    "TURSO_DATABASE_URL",
    "TURSO_AUTH_TOKEN",
    "LIBSQL_AUTH_TOKEN",
    "CLERK_SECRET_KEY",
    "VITE_CLERK_PUBLISHABLE_KEY",
)


def require(*keys):
    missing = [key for key in keys if not os.environ.get(key, "").strip()]
    if missing:
        raise SystemExit(
            "Set these values in mise.local.toml or your environment: "
            + ", ".join(missing)
        )


def environment(mode):
    env = os.environ.copy()
    env.update(
        HOST="127.0.0.1",
        PORT="8000",
        SCRYR_DIR=str(ROOT / ".cache" / mode),
        SCRYR_SQLITE_PATH=str(ROOT / ".cache" / mode / "scryr.db"),
        SCRYR_GRAPHQL_URL="http://127.0.0.1:8000/graphql",
        VITE_GRAPHQL_ENDPOINT="http://127.0.0.1:8000/graphql",
        VITE_DEBUG="true",
        RUST_BACKTRACE="1",
        CORS_ALLOWED_ORIGINS="http://127.0.0.1:3000,http://localhost:3000",
    )
    if mode == "oss":
        for key in CLOUD_KEYS:
            env.pop(key, None)
        env.update(
            AUTH_MODE="local",
            VITE_SCRYR_AUTH_MODE="local",
            SCRYR_API_TOKEN="windrunner",
        )
    else:
        require(
            "TURSO_DATABASE_URL",
            "TURSO_AUTH_TOKEN",
            "CLERK_SECRET_KEY",
            "VITE_CLERK_PUBLISHABLE_KEY",
        )
        env.update(AUTH_MODE="clerk", VITE_SCRYR_AUTH_MODE="clerk")
        env.pop("SCRYR_API_TOKEN", None)
    return env


def main():
    mode, action = sys.argv[1:]
    env = environment(mode)
    cargo = [
        "cargo",
        "run",
        "--locked",
        "--manifest-path",
        "crystal/Cargo.toml",
        "-p",
        "crystal-cli",
        "--",
        "serve",
        "--server-only",
    ]
    if action == "debug":
        subprocess.run(
            [
                "cargo",
                "build",
                "--locked",
                "--manifest-path",
                "crystal/Cargo.toml",
                "-p",
                "crystal-cli",
            ],
            cwd=ROOT,
            env={**env, "CARGO_PROFILE_DEV_DEBUG": "2"},
            check=True,
        )
        path = ROOT / ".cache" / f"debug-{mode}.env"
        path.parent.mkdir(parents=True, exist_ok=True)
        # Only debugger runtime values, never a dump of unrelated shell secrets.
        keys = {
            *CLOUD_KEYS,
            "HOST",
            "PORT",
            "AUTH_MODE",
            "CORS_ALLOWED_ORIGINS",
            "SCRYR_API_TOKEN",
            "SCRYR_DIR",
            "SCRYR_SQLITE_PATH",
            "RUST_BACKTRACE",
            "PATH",
        }
        with open(
            path, "w", opener=lambda p, flags: os.open(p, flags, 0o600)
        ) as stream:
            stream.writelines(
                f"{key}={json.dumps(env.get(key, ''))}\n" for key in sorted(keys)
            )
        path.chmod(0o600)
        return
    if action in ("ui", "remote"):
        if action == "remote":
            require("CLOUD_GRAPHQL_URL")
            env["VITE_GRAPHQL_ENDPOINT"] = os.environ["CLOUD_GRAPHQL_URL"]
        cmd = [
            "npm",
            "--prefix",
            "map",
            "run",
            "dev",
            "--",
            "--host",
            "127.0.0.1",
            "--strictPort",
        ]
    elif action == "watch":
        # Watch sources explicitly: regenerating embedded assets must not
        # trigger another restart while a build is still preparing those assets.
        watched = [
            "crystal/Cargo.toml",
            "crystal/Cargo.lock",
            "manifest/scryr/src",
            "manifest/scryr/pyproject.toml",
        ]
        for crate in sorted((ROOT / "crystal").glob("crystal-*")):
            for name in ["src", "Cargo.toml", "build.rs"]:
                if (crate / name).exists():
                    watched.append(str((crate / name).relative_to(ROOT)))
        cmd = ["watchexec", "--restart", "--debounce", "300ms"]
        for path in watched:
            cmd.extend(["--watch", path])
        cmd.extend(
            [
                "--",
                "mise",
                "run",
                f"internal:contribute:{mode}:serve",
            ]
        )

    else:
        # Changes to the SDK are reflected in the next Rust restart too.
        subprocess.run(["mise", "run", "internal:embed:manifest"], cwd=ROOT, check=True)
        cmd = cargo
    os.chdir(ROOT)
    os.execvpe(cmd[0], cmd, env)


if __name__ == "__main__":
    main()
PYTHON
'''

[tasks."internal:deploy:process"]
description = "Shared provider operations and deployment preflight"
hide = true
dir = "{{config_root}}"
usage = "arg \"<action>\" { choices \"docker\" \"ui\" \"embed\" \"secrets\" \"turso\" \"fly\" \"vercel\" \"deploy\" }"
run = '''
python - "$usage_action" <<'PYTHON'
"""Cloud deployment uses the same Rust schema as local SQLite."""

import os
import shutil
import subprocess
import sys
from urllib.parse import urlparse

import tomllib
from pathlib import Path

ROOT = Path.cwd()

def require(*keys):
    missing = [key for key in keys if not os.environ.get(key, "").strip()]
    if missing:
        raise SystemExit(
            "Set these values in mise.local.toml or your environment: "
            + ", ".join(missing)
        )


def run(*args, **kwargs):
    try:
        subprocess.run(args, cwd=ROOT, check=True, **kwargs)
    except subprocess.CalledProcessError as error:
        # Vercel takes its token as an argument. Never echo the command on failure.
        raise SystemExit(
            f"{args[0]} {args[1]} failed (exit {error.returncode})"
        ) from None


def cloud_ui_env():
    require("CLOUD_GRAPHQL_URL", "VITE_CLERK_PUBLISHABLE_KEY")
    if urlparse(os.environ["CLOUD_GRAPHQL_URL"]).scheme != "https":
        raise SystemExit("CLOUD_GRAPHQL_URL must be the public HTTPS Fly GraphQL URL")
    return {
        **os.environ,
        "VITE_GRAPHQL_ENDPOINT": os.environ["CLOUD_GRAPHQL_URL"],
        "VITE_SCRYR_AUTH_MODE": "clerk",
        "VITE_DEBUG": "false",
    }


def secrets():
    require(
        "FLY_APP",
        "CLERK_SECRET_KEY",
        "TURSO_DATABASE_URL",
        "TURSO_AUTH_TOKEN",
        "CORS_ALLOWED_ORIGINS",
    )
    # stdin keeps credential values out of command lines and task logs.
    keys = [
        "CLERK_SECRET_KEY",
        "TURSO_DATABASE_URL",
        "TURSO_AUTH_TOKEN",
        "CORS_ALLOWED_ORIGINS",
    ]
    if any("\n" in os.environ[key] for key in keys):
        raise SystemExit("Fly secret values must be single-line")
    run(
        "flyctl",
        "secrets",
        "import",
        "--stage",
        "--app",
        os.environ["FLY_APP"],
        input="".join(f"{key}={os.environ[key]}\n" for key in keys),
        text=True,
    )


def main(action):
    rust = tomllib.loads((ROOT / "mise.toml").read_text())["tools"]["rust"]["version"]
    if action == "docker":
        run(
            "docker",
            "build",
            "--file",
            "crystal/Dockerfile",
            "--build-arg",
            f"RUST_VERSION={rust}",
            "-t",
            "scryr-server",
            ".",
        )
    elif action in ("ui", "embed"):
        env = cloud_ui_env()
        if action == "embed":
            env["VITE_GRAPHQL_ENDPOINT"] = "/graphql"
        run("npm", "--prefix", "map", "ci")
        run("npm", "--prefix", "map", "run", "build", env=env)
        if action == "embed":
            destination = ROOT / "crystal/crystal-server/static/map"
            shutil.rmtree(destination)
            shutil.copytree(ROOT / "map/dist", destination)
    elif action == "secrets":
        secrets()
    elif action == "turso":
        require("TURSO_DATABASE_URL", "TURSO_AUTH_TOKEN")
        if urlparse(os.environ["TURSO_DATABASE_URL"]).scheme not in ("libsql", "https"):
            raise SystemExit("TURSO_DATABASE_URL must name a remote Turso database")
        run(
            "cargo",
            "run",
            "--locked",
            "--manifest-path",
            "crystal/Cargo.toml",
            "-p",
            "crystal-cli",
            "--",
            "migrate",
        )
    elif action == "fly":
        secrets()
        run(
            "flyctl",
            "deploy",
            ".",
            "--config",
            "crystal/fly.toml",
            "--app",
            os.environ["FLY_APP"],
            "--remote-only",
            "--build-arg",
            f"RUST_VERSION={rust}",
        )
    elif action == "vercel":
        require("VERCEL_TOKEN", "VERCEL_ORG_ID", "VERCEL_PROJECT_ID")
        env = cloud_ui_env()
        token = os.environ["VERCEL_TOKEN"]
        run(
            "vercel",
            "pull",
            "--cwd",
            "map",
            "--yes",
            "--environment=production",
            "--token",
            token,
            env=env,
        )
        run("vercel", "build", "--cwd", "map", "--prod", "--token", token, env=env)
        run(
            "vercel",
            "deploy",
            "--cwd",
            "map",
            "--prebuilt",
            "--prod",
            "--token",
            token,
            env=env,
        )
    elif action == "deploy":
        # Validate everything before the first remote write.
        require(
            "FLY_API_TOKEN",
            "FLY_APP",
            "TURSO_DATABASE_URL",
            "TURSO_AUTH_TOKEN",
            "CLERK_SECRET_KEY",
            "CORS_ALLOWED_ORIGINS",
            "VERCEL_TOKEN",
            "VERCEL_ORG_ID",
            "VERCEL_PROJECT_ID",
        )
        cloud_ui_env()
        run("mise", "run", "deploy:build")
        main("turso")
        main("fly")
        main("vercel")
    else:
        raise SystemExit(f"Unknown cloud action: {action}")


if __name__ == "__main__":
    main(sys.argv[1])
PYTHON
'''

[tasks."internal:release:process"]
description = "Shared release validation, packaging and publisher operations"
hide = true
dir = "{{config_root}}"
usage = "arg \"<action>\" { choices \"validate\" \"package\" \"draft\" \"prepare\" \"homebrew\" \"preflight\" }"
run = '''
python - "$usage_action" <<'PYTHON'
"""Build handoff and distribution of tested, versioned standalone binaries."""

import hashlib
import json
import os
import platform
import re
import shutil
import subprocess
import sys
import tarfile
from pathlib import Path

import tomllib

ROOT = Path.cwd()
OUT = ROOT / "dist" / "release"
PLATFORMS = {
    "linux-x86_64": ("linux", "x64"),
    "linux-aarch64": ("linux", "arm64"),
    "darwin-x86_64": ("darwin", "x64"),
    "darwin-aarch64": ("darwin", "arm64"),
}


def run(*args, **kwargs):
    return subprocess.run(args, check=True, cwd=ROOT, **kwargs)


def require(key):
    value = os.environ.get(key, "")
    if not value:
        raise SystemExit(f"Set {key} before publishing")
    return value


def tag_version():
    tag = require("RELEASE_TAG")
    if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
        raise SystemExit("Use a vX.Y.Z release tag")
    return tag, tag[1:]


def validate():
    tag, version = tag_version()
    run("git", "merge-base", "--is-ancestor", "HEAD", "origin/main")
    head = run(
        "git", "rev-parse", "HEAD", capture_output=True, text=True
    ).stdout.strip()
    tagged = run(
        "git", "rev-parse", tag + "^{commit}", capture_output=True, text=True
    ).stdout.strip()
    if head != tagged:
        raise SystemExit("Checkout must match RELEASE_TAG")
    paths = list((ROOT / "crystal").glob("*/Cargo.toml"))
    paths += list((ROOT / "manifest").glob("*/pyproject.toml"))
    paths += [ROOT / "manifest/pyproject.toml"]
    for path in paths:
        data = tomllib.loads(path.read_text())
        actual = data.get("package", data.get("project", {})).get("version")
        if actual != version:
            raise SystemExit(f"{path.relative_to(ROOT)}: {actual} != {version}")
    for file in ["map/package.json", "map/package-lock.json"]:
        if json.loads((ROOT / file).read_text())["version"] != version:
            raise SystemExit(f"{file} must have version {version}")





def package():
    os_name = platform.system().lower()
    arch = {"arm64": "aarch64", "AMD64": "x86_64"}.get(
        platform.machine(), platform.machine()
    )
    target = f"{os_name}-{arch}"
    if target not in PLATFORMS:
        raise SystemExit(f"Unsupported release platform: {target}")
    OUT.mkdir(parents=True, exist_ok=True)
    archive = OUT / f"scryr-{target}.tar.gz"
    with tarfile.open(archive, "w:gz") as tar:
        for path in [
            ROOT / "crystal/target/release/scryr",
            ROOT / "LICENSE",
            ROOT / "THIRD_PARTY_NOTICES.md",
        ]:
            tar.add(path, arcname=path.name)
    (OUT / f"{archive.name}.sha256").write_text(
        f"{hashlib.sha256(archive.read_bytes()).hexdigest()}  {archive.name}\n"
    )


def verify():
    sums = []
    for target in PLATFORMS:
        name = f"scryr-{target}.tar.gz"
        archive = OUT / name
        digest = hashlib.sha256(archive.read_bytes()).hexdigest()
        if (OUT / f"{name}.sha256").read_text().strip() != f"{digest}  {name}":
            raise SystemExit(f"Checksum mismatch: {name}")
        sums.append(f"{digest}  {name}\n")
    (OUT / "SHA256SUMS").write_text("".join(sums))


def draft():
    tag, _ = tag_version()
    verify()
    assets = sorted(str(path) for path in OUT.glob("*.tar.gz*")) + [
        str(OUT / "SHA256SUMS")
    ]
    run(
        "gh",
        "release",
        "create",
        tag,
        *assets,
        "--verify-tag",
        "--draft",
        "--generate-notes",
        "--title",
        f"Scryr {tag}",
    )


def prepare():
    tag, version = tag_version()
    repo = require("GH_REPO")
    release = json.loads(
        run(
            "gh",
            "release",
            "view",
            tag,
            "--json",
            "isDraft,isPrerelease",
            capture_output=True,
            text=True,
        ).stdout
    )
    if release["isDraft"] or release["isPrerelease"]:
        raise SystemExit("Publish the stable GitHub Release before distribution")
    OUT.mkdir(parents=True, exist_ok=True)
    run(
        "gh",
        "release",
        "download",
        tag,
        "--dir",
        str(OUT),
        "--pattern",
        "scryr-*.tar.gz*",
        "--clobber",
    )
    verify()
    formula = [
        "class Scryr < Formula",
        '  desc "Architecture maps and manifest CLI"',
        f'  homepage "https://github.com/{repo}"',
        f'  version "{version}"',
        '  license "MIT"',
    ]
    for os_name in ["darwin", "linux"]:
        formula.append("  on_" + ("macos" if os_name == "darwin" else "linux") + " do")
        for arch, condition in [("aarch64", "on_arm"), ("x86_64", "on_intel")]:
            name = f"scryr-{os_name}-{arch}.tar.gz"
            sha = hashlib.sha256((OUT / name).read_bytes()).hexdigest()
            formula += [
                f"    {condition} do",
                f'      url "https://github.com/{repo}/releases/download/{tag}/{name}"',
                f'      sha256 "{sha}"',
                "    end",
            ]
        formula.append("  end")
    formula += [
        "  def install",
        '    bin.install "scryr"',
        "  end",
        "  test do",
        '    assert_match version.to_s, shell_output("#{bin}/scryr --version")',
        "  end",
        "end",
    ]
    (OUT / "scryr.rb").write_text("\n".join(formula) + "\n")


def homebrew():
    tap = require("HOMEBREW_TAP")
    if not re.fullmatch(r"[\w.-]+/[\w.-]+", tap):
        raise SystemExit("HOMEBREW_TAP must be owner/repository")
    token = require("HOMEBREW_TAP_TOKEN")
    tag, _ = tag_version()
    import base64

    env = {**os.environ, "GH_TOKEN": token}
    endpoint = f"repos/{tap}/contents/Formula/scryr.rb"
    existing = subprocess.run(
        ["gh", "api", endpoint],
        cwd=ROOT,
        env=env,
        capture_output=True,
        text=True,
        check=False,
    )
    payload = {
        "message": f"Release Scryr {tag}",
        "content": base64.b64encode((OUT / "scryr.rb").read_bytes()).decode(),
    }
    if existing.returncode == 0:
        payload["sha"] = json.loads(existing.stdout)["sha"]
    if existing.returncode != 0 and "HTTP 404" not in existing.stderr:
        raise SystemExit("Could not read the Homebrew formula; publication stopped")
    run(
        "gh",
        "api",
        "--method",
        "PUT",
        endpoint,
        "--input",
        "-",
        input=json.dumps(payload),
        text=True,
        env=env,
    )


def preflight():
    tag_version()
    for key in [
        "GH_REPO",
        "HOMEBREW_TAP",
        "HOMEBREW_TAP_TOKEN",
    ]:
        require(key)


if __name__ == "__main__":
    actions = {
        fn.__name__: fn
        for fn in [
            validate,
            package,
            draft,
            prepare,
            homebrew,
            preflight,
        ]
    }
    actions[sys.argv[1]]()
PYTHON
'''

[tasks."internal:verify:workflows"]
hide = true
description = "Validate mise-only commands in GitHub workflows and local composite actions"
dir = "{{config_root}}"
run = '''
uv run --no-project --with PyYAML==6.0.3 python - <<'PYTHON'
"""Require literal mise task calls in workflows and local composite actions."""

import re
from pathlib import Path

import tomllib
import yaml

# These actions only provide GitHub orchestration. Additions require review here.
ORCHESTRATION_ACTIONS = {
    "actions/checkout",
    "jdx/mise-action",
    "actions/upload-artifact",
    "actions/download-artifact",
}
SHELLS = {"bash", "sh", "pwsh", "powershell", "cmd"}


class WorkflowLoader(yaml.BaseLoader):
    """Keep GitHub keys such as 'on' as strings and reject ambiguous mappings."""

    def construct_mapping(self, node, deep=False):
        result = {}
        for key_node, value_node in node.value:
            key = self.construct_object(key_node, deep=deep)
            if not isinstance(key, str) or key == "<<" or key in result:
                raise ValueError(
                    f"Duplicate, merged, or invalid YAML key at line {key_node.start_mark.line + 1}"
                )
            result[key] = self.construct_object(value_node, deep=deep)
        return result


def read_yaml(path):
    try:
        value = yaml.load(path.read_text(), Loader=WorkflowLoader)
    except (yaml.YAMLError, ValueError) as error:
        raise ValueError(f"{path}: invalid or ambiguous YAML") from error
    if not isinstance(value, dict):
        raise ValueError(f"{path}: expected a YAML mapping")
    return value


def check_run(command, tasks, location):
    match = (
        re.fullmatch(r"mise run ([a-zA-Z0-9_:-]+)", command.strip())
        if isinstance(command, str)
        else None
    )
    if not match or match[1] not in tasks:
        raise ValueError(f"{location}: run must be exactly mise run <declared-task>")


def check_shell(config, location):
    if "shell" in config and config["shell"] not in SHELLS:
        raise ValueError(
            f"{location}: shell must be a standard shell, without extra commands"
        )


def validate(root, tasks):
    root = root.resolve()
    visited_actions = set()
    workflow_dir = root / ".github/workflows"
    workflow_paths = sorted(
        path for path in workflow_dir.glob("*") if path.suffix in {".yml", ".yaml"}
    )

    def check_action(reference, location):
        directory = (root / reference).resolve()
        if not directory.is_relative_to(root):
            raise ValueError(
                f"{location}: local action must stay inside the repository"
            )
        candidates = [
            directory / name
            for name in ("action.yml", "action.yaml")
            if (directory / name).is_file()
        ]
        if len(candidates) != 1:
            raise ValueError(
                f"{location}: local action must have one action.yml or action.yaml"
            )
        path = candidates[0]
        if path in visited_actions:
            return
        visited_actions.add(path)
        action = read_yaml(path)
        runs = action.get("runs", {})
        if runs.get("using") != "composite":
            raise ValueError(
                f"{path}: local actions must be composites calling mise tasks"
            )
        check_steps(runs.get("steps", []), str(path))

    def check_steps(steps, location):
        for index, step in enumerate(steps):
            here = f"{location}.steps[{index}]"
            if not isinstance(step, dict) or ("run" in step) == ("uses" in step):
                raise ValueError(f"{here}: expected exactly one run or uses")
            check_shell(step, here)
            if "run" in step:
                check_run(step["run"], tasks, here)
            else:
                reference = step["uses"]
                if reference.startswith("./"):
                    check_action(reference, here)
                elif (
                    reference.split("@", 1)[0] not in ORCHESTRATION_ACTIONS
                    or "@" not in reference
                ):
                    raise ValueError(
                        f"{here}: only approved orchestration actions or local mise composites are allowed"
                    )

    for path in workflow_paths:
        workflow = read_yaml(path)
        check_shell(workflow.get("defaults", {}).get("run", {}), str(path))
        for name, job in workflow.get("jobs", {}).items():
            location = f"{path}.jobs.{name}"
            check_shell(job.get("defaults", {}).get("run", {}), location)
            if "uses" in job:
                reference = job["uses"]
                if (
                    not reference.startswith("./")
                    or (root / reference).resolve() not in workflow_paths
                ):
                    raise ValueError(
                        f"{location}: reusable workflows must be checked local workflows"
                    )
            else:
                check_steps(job.get("steps", []), location)

    # Inspect unused composites in .github too, and follow referenced actions anywhere in the repo.
    for pattern in ("action.yml", "action.yaml"):
        for path in sorted((root / ".github").rglob(pattern)):
            check_action(str(path.parent.relative_to(root)), str(path))


def main():
    root = Path.cwd()
    tasks = tomllib.loads((root / "mise.toml").read_text())["tasks"]
    if any("alias" in task for task in tasks.values()):
        raise ValueError("Task aliases are not supported")
    if (root / "scripts").exists():
        raise ValueError("Keep task implementations inside mise.toml")
    validate(root, tasks)
    print(
        "All workflow and composite-action commands directly call declared mise tasks"
    )


if __name__ == "__main__":
    try:
        main()
    except ValueError as error:
        raise SystemExit(str(error)) from None
PYTHON
'''

[tasks."internal:verify:regressions"]
description = "Test runtime isolation, migration order and release packaging"
hide = true
dir = "{{config_root}}"
run = '''
uv run --no-project --with PyYAML==6.0.3 python - <<'PYTHON'
"""Regression checks for credential isolation and release/deployment boundaries."""

import hashlib
import io
import json
import os
import tarfile
import tempfile
import unittest
from pathlib import Path
from unittest.mock import patch

import sys
import tomllib
import types


def task_module(name):
    config = tomllib.loads(Path("mise.toml").read_text())
    command = config["tasks"][name]["run"]
    body = command.split("<<'PYTHON'\n", 1)[1].rsplit("\nPYTHON", 1)[0]
    module = types.ModuleType(name)
    sys.modules[name] = module
    exec(compile(body, "mise.toml:" + name, "exec"), module.__dict__)
    return module


dev, cloud, release, workflows = (
    task_module(name) for name in (
        "internal:contribute:process", "internal:deploy:process",
        "internal:release:process", "internal:verify:workflows",
    )
)


class AutomationTests(unittest.TestCase):
    def test_oss_discards_ambient_cloud_credentials(self):
        with patch.dict(
            os.environ, {key: "ambient-cloud-value" for key in dev.CLOUD_KEYS}
        ):
            env = dev.environment("oss")
        self.assertTrue(all(key not in env for key in dev.CLOUD_KEYS))
        self.assertEqual(env["AUTH_MODE"], "local")
        self.assertEqual(env["VITE_GRAPHQL_ENDPOINT"], "http://127.0.0.1:8000/graphql")

    def test_debug_writes_private_runtime_environment(self):
        with tempfile.TemporaryDirectory() as directory:
            with (
                patch.object(dev, "ROOT", Path(directory)),
                patch.object(dev.subprocess, "run"),
                patch.object(dev.sys, "argv", ["dev.py", "oss", "debug"]),
            ):
                dev.main()
            path = Path(directory) / ".cache/debug-oss.env"
            self.assertEqual(path.stat().st_mode & 0o777, 0o600)
            self.assertIn('AUTH_MODE="local"', path.read_text())
            self.assertIn('TURSO_DATABASE_URL=""', path.read_text())

    def test_cloud_requires_credentials(self):
        with patch.dict(os.environ, {}, clear=True), self.assertRaises(SystemExit):
            dev.environment("cloud")

    def test_cloud_uses_clerk_and_remote_storage(self):
        values = {key: "cloud-value" for key in dev.CLOUD_KEYS}
        with patch.dict(os.environ, values):
            env = dev.environment("cloud")
        self.assertEqual(env["AUTH_MODE"], "clerk")
        self.assertEqual(env["VITE_SCRYR_AUTH_MODE"], "clerk")
        self.assertEqual(env["TURSO_DATABASE_URL"], values["TURSO_DATABASE_URL"])
        self.assertNotIn("SCRYR_API_TOKEN", env)

    def test_deployment_error_does_not_echo_token(self):
        with (
            patch.object(
                cloud.subprocess,
                "run",
                side_effect=cloud.subprocess.CalledProcessError(
                    1, ["vercel", "deploy", "--token", "private-value"]
                ),
            ),
            self.assertRaises(SystemExit) as error,
        ):
            cloud.run("vercel", "deploy", "--token", "private-value")
        self.assertNotIn("private-value", str(error.exception))

    def test_cloud_preflight_stops_before_any_remote_call(self):
        with patch.dict(os.environ, {}, clear=True), patch.object(cloud, "run") as run:
            with self.assertRaises(SystemExit):
                cloud.main("deploy")
            run.assert_not_called()

    def test_cloud_deploy_migrates_before_fly_and_vercel(self):
        keys = [
            "FLY_API_TOKEN",
            "FLY_APP",
            "TURSO_DATABASE_URL",
            "TURSO_AUTH_TOKEN",
            "CLERK_SECRET_KEY",
            "CORS_ALLOWED_ORIGINS",
            "VERCEL_TOKEN",
            "VERCEL_ORG_ID",
            "VERCEL_PROJECT_ID",
            "VITE_CLERK_PUBLISHABLE_KEY",
        ]
        values = {key: "configured" for key in keys}
        values.update(
            CLOUD_GRAPHQL_URL="https://example.fly.dev/graphql",
            TURSO_DATABASE_URL="libsql://example.turso.io",
        )
        with patch.dict(os.environ, values), patch.object(cloud, "run") as run:
            cloud.main("deploy")
        calls = [call.args for call in run.call_args_list]
        self.assertEqual(calls[0], ("mise", "run", "deploy:build"))
        migrate = next(i for i, call in enumerate(calls) if call[-1] == "migrate")
        fly = next(
            i for i, call in enumerate(calls) if call[:2] == ("flyctl", "deploy")
        )
        vercel = next(
            i for i, call in enumerate(calls) if call[:2] == ("vercel", "deploy")
        )
        self.assertLess(migrate, fly)
        self.assertLess(fly, vercel)

    def test_release_checksums_reject_corruption(self):
        with (
            tempfile.TemporaryDirectory() as directory,
            patch.object(release, "OUT", Path(directory)),
        ):
            for target in release.PLATFORMS:
                name = f"scryr-{target}.tar.gz"
                path = Path(directory) / name
                path.write_bytes(b"binary")
                (Path(directory) / f"{name}.sha256").write_text(
                    f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {name}\n"
                )
            release.verify()
            path.write_bytes(b"corrupted")
            with self.assertRaises(SystemExit):
                release.verify()

    def test_homebrew_formula_uses_verified_binaries(self):
        with (
            tempfile.TemporaryDirectory() as directory,
            patch.object(release, "OUT", Path(directory)),
        ):
            for target in release.PLATFORMS:
                name = f"scryr-{target}.tar.gz"
                path = Path(directory) / name
                with tarfile.open(path, "w:gz") as archive:
                    data = b"#!/bin/sh\necho scryr 1.2.3\n"
                    member = tarfile.TarInfo("scryr")
                    member.size = len(data)
                    member.mode = 0o755
                    archive.addfile(member, io.BytesIO(data))
                (Path(directory) / f"{name}.sha256").write_text(
                    f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {name}\n"
                )
            with (
                patch.dict(
                    os.environ,
                    {
                        "RELEASE_TAG": "v1.2.3",
                        "GH_REPO": "example/scryr",
                    },
                ),
                patch.object(release, "run") as run,
            ):
                run.return_value.stdout = '{"isDraft": false, "isPrerelease": false}'
                release.prepare()
            formula = (Path(directory) / "scryr.rb").read_text()
            self.assertEqual(formula.count("sha256"), 4)
            self.assertIn("/releases/download/v1.2.3/", formula)


class WorkflowPolicyTests(unittest.TestCase):
    def setUp(self):
        self.directory = tempfile.TemporaryDirectory()
        self.addCleanup(self.directory.cleanup)
        self.root = Path(self.directory.name)
        self.path = self.root / ".github/workflows/ci.yml"
        self.path.parent.mkdir(parents=True)
        self.tasks = {"verify": {}, "verify:manifest": {}}

    def write_workflow(self, steps):
        self.path.write_text(
            "on: push\njobs:\n  check:\n    runs-on: ubuntu-latest\n    steps:\n"
            + steps
        )

    def test_accepts_plain_quoted_block_and_flow_calls(self):
        for steps in (
            "      - run: mise run verify\n",
            '      - run: "mise run verify:manifest"\n',
            "      - run: |\n          mise run verify\n",
            "      - run: >-\n          mise run\n          verify\n",
            "      - {run: mise run verify}\n",
            "      - uses: actions/checkout@v7\n      - run: mise run verify\n",
        ):
            with self.subTest(steps=steps):
                self.write_workflow(steps)
                workflows.validate(self.root, self.tasks)

    def test_rejects_unknown_dynamic_or_multiple_commands(self):
        for command in (
            "mise run absent",
            "npm test",
            "mise run verify && npm test",
            "mise run verify; npm test",
            "mise run verify | tee result",
            "mise run $TASK",
            "mise run $" + "{" + "{ inputs.task }}",
            "mise run verify $(echo extra)",
            "mise run verify --force",
        ):
            with self.subTest(command=command):
                self.write_workflow("      - run: " + json.dumps(command) + "\n")
                with self.assertRaises(ValueError):
                    workflows.validate(self.root, self.tasks)
        self.write_workflow(
            "      - run: |\n          mise run verify\n          npm test\n"
        )
        with self.assertRaises(ValueError):
            workflows.validate(self.root, self.tasks)

    def test_yaml_extension_is_checked(self):
        self.write_workflow("      - run: npm test\n")
        self.path.rename(self.path.with_suffix(".yaml"))
        with self.assertRaises(ValueError):
            workflows.validate(self.root, self.tasks)

    def test_duplicate_keys_and_shell_bypasses_are_rejected(self):
        for steps in (
            "      - run: npm test\n        run: mise run verify\n",
            "      - run: mise run verify\n        shell: bash -c 'npm test'\n",
            "      - uses: actions/github-script@v8\n        with:\n          script: dangerous()\n",
        ):
            with self.subTest(steps=steps):
                self.write_workflow(steps)
                with self.assertRaises(ValueError):
                    workflows.validate(self.root, self.tasks)
        self.write_workflow("      - run: mise run verify\n")
        self.path.write_text(
            "defaults:\n  run:\n    shell: bash -c 'npm test'\n" + self.path.read_text()
        )
        with self.assertRaises(ValueError):
            workflows.validate(self.root, self.tasks)

    def test_local_composites_are_checked_recursively(self):
        self.write_workflow("      - uses: ./.github/actions/check\n")
        first = self.root / ".github/actions/check/action.yml"
        second = self.root / "automation/nested/action.yaml"
        first.parent.mkdir(parents=True)
        second.parent.mkdir(parents=True)
        first.write_text(
            "runs:\n  using: composite\n  steps:\n    - uses: ./automation/nested\n"
        )
        second.write_text(
            "runs:\n  using: composite\n  steps:\n    - run: mise run verify\n      shell: bash\n"
        )
        workflows.validate(self.root, self.tasks)
        second.write_text(
            "runs:\n  using: composite\n  steps:\n    - run: npm test\n      shell: bash\n"
        )
        with self.assertRaises(ValueError):
            workflows.validate(self.root, self.tasks)

    def test_local_reusable_workflow_is_checked(self):
        self.path.write_text(
            "jobs:\n  check:\n    uses: ./.github/workflows/reusable.yaml\n"
        )
        other = self.path.parent / "reusable.yaml"
        other.write_text("jobs:\n  check:\n    steps:\n      - run: mise run verify\n")
        workflows.validate(self.root, self.tasks)
        other.write_text("jobs:\n  check:\n    steps:\n      - run: npm test\n")
        with self.assertRaises(ValueError):
            workflows.validate(self.root, self.tasks)

    def test_task_contract_and_references(self):
        import re

        tasks = tomllib.loads(Path("mise.toml").read_text())["tasks"]
        self.assertEqual(
            tasks["pre-commit"]["run"], ["mise run contribute:fix", "mise run verify"]
        )
        self.assertEqual(
            tasks["verify"]["run"],
            [
                "mise run verify:automation",
                "mise run verify:manifest",
                "mise run verify:crystal",
                "mise run verify:map",
                "mise run verify:release",
            ],
        )
        for name, task in tasks.items():
            self.assertFalse(
                {"python", "rust", "typescript", "ui"} & set(name.split(":")), name
            )
            self.assertEqual(
                task.get("hide", False), name.startswith("internal:"), name
            )
            commands = task.get("run", [])
            commands = [commands] if isinstance(commands, str) else commands
            # Inline implementation/test bodies have dynamic references and fixtures;
            # validate their behavior separately instead of interpreting source text as shell.
            for command in commands:
                if "<<'PYTHON'" not in command:
                    for reference in re.findall(r"mise run ([\w:-]+)", command):
                        self.assertIn(reference, tasks, (name, reference))
            for dependency in task.get("depends", []):
                self.assertIn(dependency, tasks, (name, dependency))

    def test_watchers_call_declared_serve_tasks(self):
        tasks = tomllib.loads(Path("mise.toml").read_text())["tasks"]
        for mode in ("oss", "cloud"):
            with (
                self.subTest(mode=mode),
                patch.object(dev, "environment", return_value={}),
                patch.object(dev.sys, "argv", ["dev", mode, "watch"]),
                patch.object(dev.os, "chdir"),
                patch.object(dev.os, "execvpe") as execute,
            ):
                dev.main()
                command = execute.call_args.args[1]
                self.assertEqual(
                    command[-3:], ["mise", "run", f"internal:contribute:{mode}:serve"]
                )
                self.assertIn(command[-1], tasks)


if __name__ == "__main__":
    unittest.main()
PYTHON
'''
