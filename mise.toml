# Release: build, validate, package, draft, then distribute

[tasks."release"]
description = "Show the release workflow and required commands"
dir = "{{config_root}}"
run = """
cat <<'GUIDE'
Release the standalone CLI:
  mise run release:build          Build the embedded CLI locally
  mise run verify:release:smoke    Test that build outside the checkout
  mise run release:validate       Check RELEASE_TAG, checkout, ancestry, versions
  mise run release:package        Archive the tested binary on each platform
  mise run release:draft          Create a draft from all four platform archives
Review and publish the draft on GitHub, then:
  mise run release:distribute     Publish the Homebrew formula
Pushing a vX.Y.Z tag starts validation, checks, packaging, and draft creation.
Publishing the GitHub draft starts distribution. See CONTRIBUTING.md for inputs.
GUIDE
"""

[tasks."release:build"]
description = "Build the self-contained open-source scryr CLI with embedded SDK and UI"
dir = "{{config_root}}"
run = [
  "mise run internal:dependencies:manifest",
  "mise run internal:embed:manifest",
  "mise run internal:embed:map:oss",
  "mise run internal:release:build:crystal",
]

[tasks."release:validate"]
description = "Validate the release tag, main ancestry and versions"
run = "mise run internal:release:process validate"
dir = "{{config_root}}"

[tasks."release:package"]
description = "Archive the native binary and notices into dist/release; run verify:release first"
run = "mise run internal:release:process package"
dir = "{{config_root}}"

[tasks."release:draft"]
description = "Verify all four platform archives and create a GitHub draft; requires RELEASE_TAG and GH_TOKEN"
run = "mise run internal:release:process draft"
tools = { "gh" = "2.92.0" }
dir = "{{config_root}}"

[tasks."release:distribute"]
description = "Distribute the published standalone release through Homebrew"
run = [
  "mise run internal:release:preflight",
  "mise run release:distribution:prepare",
  "mise run release:distribute:homebrew",
]
dir = "{{config_root}}"

[tasks."release:build:docker"]
description = "Build the standalone CLI and local server image; requires Docker"
run = ["mise run release:build", "mise run internal:deploy:process docker"]
tools = { "docker-cli" = "29.4.3" }
dir = "{{config_root}}"

[tasks."release:distribution:prepare"]
description = "Verify published release artifacts and prepare the Homebrew formula"
run = "mise run internal:release:process prepare"
tools = { "gh" = "2.92.0" }
dir = "{{config_root}}"

[tasks."release:distribute:homebrew"]
description = "Publish the prepared homebrew distribution"
run = "mise run internal:release:process homebrew"
tools = { "gh" = "2.92.0" }
dir = "{{config_root}}"

# Deployment: build, migrate, and update configured cloud resources

[tasks."deploy"]
description = "Show the deploy workflow and required commands"
dir = "{{config_root}}"
run = """
cat <<'GUIDE'
Deploy configured cloud resources:
  mise run release:validate       Validate the checked-out RELEASE_TAG
  mise run deploy:cloud           Build, migrate Turso, deploy Fly, deploy Vercel
Set credentials and resource IDs from mise.local.toml.example first.
GitHub: run the Deploy cloud workflow with the versioned release tag.
For targeted maintenance, see deploy:* tasks and CONTRIBUTING.md.
GUIDE
"""

[tasks."deploy:cloud"]
description = "Build, migrate Turso, deploy Fly, then Vercel production; requires configured cloud credentials"
run = "mise run internal:deploy:process deploy"
tools = { "flyctl" = "0.4.95", "npm:vercel" = "59.11.7" }
dir = "{{config_root}}"

[tasks."deploy:build"]
description = "Build Clerk-enabled map assets and the crystal CLI for Fly; requires cloud UI configuration"
run = [
  "mise run internal:dependencies:manifest",
  "mise run internal:embed:manifest",
  "mise run internal:embed:map:cloud",
  "mise run internal:release:build:crystal",
