# Shared toolchain and task entrypoints for contributors and GitHub Actions.
# Put cloud credentials in ignored mise.local.toml (see mise.local.toml.example).
[tools]
rust = { version = "1.96.0", profile = "minimal", components = ["rustfmt", "clippy"] }
python = "3.14.6"
uv = "0.11.12"
node = "26.1.0"
watchexec = "2.5.1"

[settings]
python.uv_venv_auto = "create|source"

[env]
UV_CACHE_DIR = "{{config_root}}/.cache/uv"

# All task implementations live here. Runtime defaults are scoped to the
# contributor modes so they cannot leak into cloud deployment.

# Contributor entrypoints

[tasks."setup"]
description = "Install contributor dependencies"
run = "mise run install-dependencies"
dir = "{{config_root}}"

[tasks."dev:oss"]
description = "Contribute with Rust restart, Vite HMR, local SQLite and local auth"
depends = ["dev:server:oss", "dev:ui:oss"]
dir = "{{config_root}}"

[tasks."dev:cloud"]
description = "Contribute with Rust restart, Vite HMR, Turso and Clerk"
depends = ["dev:server:cloud", "dev:ui:cloud"]
dir = "{{config_root}}"

[tasks."dev:server:oss"]
description = "Watch and restart the oss Rust server"
run = "mise run dev:process oss watch"
dir = "{{config_root}}"

[tasks."dev:ui:oss"]
description = "Run Vite HMR with oss configuration"
run = "mise run dev:process oss ui"
dir = "{{config_root}}"

[tasks."run:server:local"]
description = "Run the oss Rust server once"
run = "mise run dev:process oss server"
dir = "{{config_root}}"

[tasks."debug:oss"]
description = "Build Rust with symbols and prepare the VS Code environment"
run = "mise run dev:process oss debug"
dir = "{{config_root}}"

[tasks."dev:server:cloud"]
description = "Watch and restart the cloud Rust server"
run = "mise run dev:process cloud watch"
dir = "{{config_root}}"

[tasks."dev:ui:cloud"]
description = "Run Vite HMR with cloud configuration"
run = "mise run dev:process cloud ui"
dir = "{{config_root}}"

[tasks."run:server:cloud"]
description = "Run the cloud Rust server once"
run = "mise run dev:process cloud server"
dir = "{{config_root}}"

[tasks."debug:cloud"]
description = "Build Rust with symbols and prepare the VS Code environment"
run = "mise run dev:process cloud debug"
dir = "{{config_root}}"

[tasks."dev:cloud:remote"]
description = "Run Vite HMR against the deployed Fly API"
run = "mise run dev:process cloud remote"
dir = "{{config_root}}"

# Dependency installation

[tasks."install-dependencies"]
description = "Install all local development dependencies"
dir = "{{config_root}}"
run = [
  "mise run rust:install-dependencies",
  "mise run python:install-dependencies",
  "mise run typescript:install-dependencies",
]

[tasks."rust:install-dependencies"]
description = "Fetch Rust dependencies"
dir = "{{config_root}}"
hide = true
run = "cargo fetch --locked --manifest-path crystal/Cargo.toml"

[tasks."python:install-dependencies"]
description = "Install Python workspace dependencies"
dir = "{{config_root}}"
hide = true
run = "cd manifest && uv sync --locked --all-packages"

[tasks."typescript:install-dependencies"]
description = "Install TypeScript frontend dependencies"
dir = "{{config_root}}"
hide = true
run = "npm --prefix map ci"

