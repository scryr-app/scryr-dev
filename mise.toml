[tasks."embed:samples"]
description = "Generate bundled sample artifacts for the embedded server"
dir = "{{config_root}}"
hide = true
run = '''
#!/usr/bin/env bash
set -eu
unset SCRYR_SPRITE SCRYR_SPRITE_ORG SCRYR_SPRITE_BIN

rm -rf crystal/crystal-server/static/samples
mkdir -p crystal/crystal-server/static/samples
for sample_path in manifest/tests/samples/*/index.scry; do
