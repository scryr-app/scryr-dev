"""Keep workflow run steps as single calls to tasks declared in mise.toml."""

import re
from pathlib import Path

import tomllib

config = tomllib.loads(Path("mise.toml").read_text())
tasks = config["tasks"]
for path in Path(".github/workflows").glob("*.yml"):
    for number, line in enumerate(path.read_text().splitlines(), 1):
        if re.match(r"\s*(?:- )?run:", line):
            match = re.fullmatch(r"\s*(?:- )?run: mise run ([\w:-]+)\s*", line)
            if not match or match[1] not in tasks:
                raise SystemExit(
                    f"{path}:{number}: run must directly call a declared mise task"
                )
print("All workflow commands directly call declared mise tasks")

assert all("alias" not in task for task in tasks.values()), "Task aliases are not supported"
assert not Path("scripts").exists(), "Keep task implementations inside mise.toml"
PYTHON
