# Shared inline implementation: cloud providers

[tasks."cloud:process"]
description = "Shared provider operations and deployment preflight"
hide = true
dir = "{{config_root}}"
usage = "arg \"<action>\" { choices \"docker\" \"ui\" \"embed\" \"secrets\" \"turso\" \"fly\" \"vercel\" \"deploy\" }"
run = '''
python - "$usage_action" <<'PYTHON'
"""Cloud deployment uses the same Rust schema as local SQLite."""

import os
import shutil
import subprocess
import sys
from urllib.parse import urlparse

import tomllib
from pathlib import Path

ROOT = Path.cwd()

def require(*keys):
    missing = [key for key in keys if not os.environ.get(key, "").strip()]
    if missing:
        raise SystemExit(
            "Set these values in mise.local.toml or your environment: "
            + ", ".join(missing)
        )


def run(*args, **kwargs):
    try:
        subprocess.run(args, cwd=ROOT, check=True, **kwargs)
    except subprocess.CalledProcessError as error:
        # Vercel takes its token as an argument. Never echo the command on failure.
        raise SystemExit(
            f"{args[0]} {args[1]} failed (exit {error.returncode})"
        ) from None


def cloud_ui_env():
    require("CLOUD_GRAPHQL_URL", "VITE_CLERK_PUBLISHABLE_KEY")
    if urlparse(os.environ["CLOUD_GRAPHQL_URL"]).scheme != "https":
        raise SystemExit("CLOUD_GRAPHQL_URL must be the public HTTPS Fly GraphQL URL")
    return {
        **os.environ,
        "VITE_GRAPHQL_ENDPOINT": os.environ["CLOUD_GRAPHQL_URL"],
        "VITE_SCRYR_AUTH_MODE": "clerk",
        "VITE_DEBUG": "false",
    }


def secrets():
    require(
        "FLY_APP",
        "CLERK_SECRET_KEY",
        "TURSO_DATABASE_URL",
        "TURSO_AUTH_TOKEN",
        "CORS_ALLOWED_ORIGINS",
    )
    # stdin keeps credential values out of command lines and task logs.
    keys = [
        "CLERK_SECRET_KEY",
        "TURSO_DATABASE_URL",
        "TURSO_AUTH_TOKEN",
        "CORS_ALLOWED_ORIGINS",
    ]
    if any("\n" in os.environ[key] for key in keys):
        raise SystemExit("Fly secret values must be single-line")
    run(
        "flyctl",
        "secrets",
        "import",
        "--stage",
        "--app",
        os.environ["FLY_APP"],
        input="".join(f"{key}={os.environ[key]}\n" for key in keys),
        text=True,
    )


def main(action):
    rust = tomllib.loads((ROOT / "mise.toml").read_text())["tools"]["rust"]["version"]
    if action == "docker":
        run(
            "docker",
            "build",
            "--build-arg",
            f"RUST_VERSION={rust}",
            "-t",
            "scryr-server",
            "crystal",
        )
    elif action in ("ui", "embed"):
        env = cloud_ui_env()
        if action == "embed":
            env["VITE_GRAPHQL_ENDPOINT"] = "/graphql"
        run("npm", "--prefix", "map", "ci")
        run("npm", "--prefix", "map", "run", "build", env=env)
        if action == "embed":
            destination = ROOT / "crystal/crystal-server/static/map"
            shutil.rmtree(destination)
            shutil.copytree(ROOT / "map/dist", destination)
    elif action == "secrets":
        secrets()
    elif action == "turso":
        require("TURSO_DATABASE_URL", "TURSO_AUTH_TOKEN")
        if urlparse(os.environ["TURSO_DATABASE_URL"]).scheme not in ("libsql", "https"):
            raise SystemExit("TURSO_DATABASE_URL must name a remote Turso database")
        run(
            "cargo",
            "run",
            "--locked",
            "--manifest-path",
            "crystal/Cargo.toml",
            "-p",
            "crystal-cli",
            "--",
            "migrate",
        )
    elif action == "fly":
        secrets()
        run(
            "flyctl",
            "deploy",
            "crystal",
            "--app",
            os.environ["FLY_APP"],
            "--remote-only",
            "--build-arg",
            f"RUST_VERSION={rust}",
        )
    elif action == "vercel":
        require("VERCEL_TOKEN", "VERCEL_ORG_ID", "VERCEL_PROJECT_ID")
        env = cloud_ui_env()
        token = os.environ["VERCEL_TOKEN"]
        run(
            "vercel",
            "pull",
            "--cwd",
            "map",
            "--yes",
            "--environment=production",
            "--token",
            token,
            env=env,
        )
        run("vercel", "build", "--cwd", "map", "--prod", "--token", token, env=env)
        run(
            "vercel",
            "deploy",
            "--cwd",
            "map",
            "--prebuilt",
            "--prod",
            "--token",
            token,
            env=env,
        )
    elif action == "deploy":
        # Validate everything before the first remote write.
        require(
            "FLY_API_TOKEN",
            "FLY_APP",
            "TURSO_DATABASE_URL",
            "TURSO_AUTH_TOKEN",
            "CLERK_SECRET_KEY",
            "CORS_ALLOWED_ORIGINS",
            "VERCEL_TOKEN",
            "VERCEL_ORG_ID",
            "VERCEL_PROJECT_ID",
        )
        cloud_ui_env()
        run("mise", "run", "build:cloud")
        main("turso")
        main("fly")
        main("vercel")
    else:
        raise SystemExit(f"Unknown cloud action: {action}")


if __name__ == "__main__":
    main(sys.argv[1])
PYTHON
'''

# Shared inline implementation: release packaging

[tasks."release:process"]
description = "Shared release validation, packaging and publisher operations"
hide = true
dir = "{{config_root}}"
usage = "arg \"<action>\" { choices \"validate\" \"package\" \"draft\" \"prepare\" \"npm\" \"homebrew\" \"crates\" \"preflight\" }"
run = '''
python - "$usage_action" <<'PYTHON'
"""Build handoff and distribution of tested, versioned standalone binaries."""

import hashlib
import json
import os
import platform
import re
import shutil
import subprocess
import sys
import tarfile
import tempfile
from pathlib import Path

import tomllib

ROOT = Path.cwd()
OUT = ROOT / "dist" / "release"
PLATFORMS = {
    "linux-x86_64": ("linux", "x64"),
    "linux-aarch64": ("linux", "arm64"),
    "darwin-x86_64": ("darwin", "x64"),
    "darwin-aarch64": ("darwin", "arm64"),
}


def run(*args, **kwargs):
    return subprocess.run(args, check=True, cwd=ROOT, **kwargs)


def require(key):
    value = os.environ.get(key, "")
    if not value:
        raise SystemExit(f"Set {key} before publishing")
    return value


def tag_version():
    tag = require("RELEASE_TAG")
    if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
        raise SystemExit("Use a vX.Y.Z release tag")
    return tag, tag[1:]


def validate():
    tag, version = tag_version()
    run("git", "merge-base", "--is-ancestor", "HEAD", "origin/main")
    head = run(
        "git", "rev-parse", "HEAD", capture_output=True, text=True
    ).stdout.strip()
    tagged = run(
        "git", "rev-parse", tag + "^{commit}", capture_output=True, text=True
    ).stdout.strip()
    if head != tagged:
        raise SystemExit("Checkout must match RELEASE_TAG")
    paths = list((ROOT / "crystal").glob("*/Cargo.toml"))
    paths += list((ROOT / "manifest").glob("*/pyproject.toml"))
    paths += [ROOT / "manifest/pyproject.toml"]
    for path in paths:
        data = tomllib.loads(path.read_text())
        actual = data.get("package", data.get("project", {})).get("version")
        if actual != version:
            raise SystemExit(f"{path.relative_to(ROOT)}: {actual} != {version}")
    for file in ["map/package.json", "map/package-lock.json"]:
        if json.loads((ROOT / file).read_text())["version"] != version:
            raise SystemExit(f"{file} must have version {version}")





def package():
    os_name = platform.system().lower()
    arch = {"arm64": "aarch64", "AMD64": "x86_64"}.get(
        platform.machine(), platform.machine()
    )
    target = f"{os_name}-{arch}"
    if target not in PLATFORMS:
        raise SystemExit(f"Unsupported release platform: {target}")
    OUT.mkdir(parents=True, exist_ok=True)
    archive = OUT / f"scryr-{target}.tar.gz"
    with tarfile.open(archive, "w:gz") as tar:
        for path in [
            ROOT / "crystal/target/release/scryr",
            ROOT / "LICENSE",
            ROOT / "THIRD_PARTY_NOTICES.md",
        ]:
            tar.add(path, arcname=path.name)
    (OUT / f"{archive.name}.sha256").write_text(
        f"{hashlib.sha256(archive.read_bytes()).hexdigest()}  {archive.name}\n"
    )


def verify():
    sums = []
    for target in PLATFORMS:
        name = f"scryr-{target}.tar.gz"
        archive = OUT / name
        digest = hashlib.sha256(archive.read_bytes()).hexdigest()
        if (OUT / f"{name}.sha256").read_text().strip() != f"{digest}  {name}":
            raise SystemExit(f"Checksum mismatch: {name}")
        sums.append(f"{digest}  {name}\n")
    (OUT / "SHA256SUMS").write_text("".join(sums))


def draft():
    tag, _ = tag_version()
    verify()
    assets = sorted(str(path) for path in OUT.glob("*.tar.gz*")) + [
        str(OUT / "SHA256SUMS")
    ]
    run(
        "gh",
        "release",
        "create",
        tag,
        *assets,
        "--verify-tag",
        "--draft",
        "--generate-notes",
        "--title",
        f"Scryr {tag}",
    )


def prepare():
    tag, version = tag_version()
    repo = require("GH_REPO")
    npm_name = require("NPM_PACKAGE_NAME")
    if not re.fullmatch(r"@[a-z0-9_-]+/[a-z0-9_-]+", npm_name):
        raise SystemExit(
            "NPM_PACKAGE_NAME must be a scoped npm name, for example @scryr/cli"
        )
    release = json.loads(
        run(
            "gh",
            "release",
            "view",
            tag,
            "--json",
            "isDraft,isPrerelease",
            capture_output=True,
            text=True,
        ).stdout
    )
    if release["isDraft"] or release["isPrerelease"]:
        raise SystemExit("Publish the stable GitHub Release before distribution")
    OUT.mkdir(parents=True, exist_ok=True)
    run(
        "gh",
        "release",
        "download",
        tag,
        "--dir",
        str(OUT),
        "--pattern",
        "scryr-*.tar.gz*",
        "--clobber",
    )
    verify()
    packages = OUT / "npm"
    packages.mkdir(exist_ok=True)
    optional = {}
    for target, (os_name, cpu) in PLATFORMS.items():
        name = f"{npm_name}-{os_name}-{cpu}"
        optional[name] = version
        dest = packages / target
        dest.mkdir(exist_ok=True)
        with tarfile.open(OUT / f"scryr-{target}.tar.gz") as tar:
            tar.extractall(dest, filter="data")
        (dest / "scryr").chmod(0o755)
        (dest / "package.json").write_text(
            json.dumps(
                {
                    "name": name,
                    "version": version,
                    "description": "Scryr standalone native CLI",
                    "license": "MIT",
                    "os": [os_name],
                    "cpu": [cpu],
                    "files": ["scryr", "LICENSE", "THIRD_PARTY_NOTICES.md"],
                    "repository": f"https://github.com/{repo}",
                },
                indent=2,
            )
            + "\n"
        )
    wrapper = packages / "cli"
    wrapper.mkdir(exist_ok=True)
    (wrapper / "package.json").write_text(
        json.dumps(
            {
                "name": npm_name,
                "version": version,
                "description": "Scryr CLI with embedded UI and SDK",
                "license": "MIT",
                "bin": {"scryr": "scryr.cjs"},
                "files": ["scryr.cjs", "LICENSE", "THIRD_PARTY_NOTICES.md"],
                "optionalDependencies": optional,
                "repository": f"https://github.com/{repo}",
            },
            indent=2,
        )
        + "\n"
    )
    (wrapper / "scryr.cjs").write_text(
        """#!/usr/bin/env node
const { spawnSync } = require('node:child_process');
const name = __PACKAGE_NAME__ + '-' + process.platform + '-' + process.arch;
let binary;
try { binary = require.resolve(name + '/scryr'); }
catch { console.error('No Scryr binary for ' + process.platform + '/' + process.arch + '. Install optional dependencies.'); process.exit(1); }
const result = spawnSync(binary, process.argv.slice(2), {stdio: 'inherit'});
if (result.error) { console.error(result.error.message); process.exit(1); }
if (result.signal) process.kill(process.pid, result.signal);
else process.exit(result.status ?? 1);
""".replace("__PACKAGE_NAME__", json.dumps(npm_name))
    )
    (wrapper / "scryr.cjs").chmod(0o755)
    for file in ["LICENSE", "THIRD_PARTY_NOTICES.md"]:
        shutil.copy2(ROOT / file, wrapper / file)
    formula = [
        "class Scryr < Formula",
        '  desc "Architecture maps and manifest CLI"',
        f'  homepage "https://github.com/{repo}"',
        f'  version "{version}"',
        '  license "MIT"',
    ]
    for os_name in ["darwin", "linux"]:
        formula.append("  on_" + ("macos" if os_name == "darwin" else "linux") + " do")
        for arch, condition in [("aarch64", "on_arm"), ("x86_64", "on_intel")]:
            name = f"scryr-{os_name}-{arch}.tar.gz"
            sha = hashlib.sha256((OUT / name).read_bytes()).hexdigest()
            formula += [
                f"    {condition} do",
                f'      url "https://github.com/{repo}/releases/download/{tag}/{name}"',
                f'      sha256 "{sha}"',
                "    end",
            ]
        formula.append("  end")
    formula += [
        "  def install",
        '    bin.install "scryr"',
        "  end",
        "  test do",
        '    assert_match version.to_s, shell_output("#{bin}/scryr --version")',
        "  end",
        "end",
    ]
    (OUT / "scryr.rb").write_text("\n".join(formula) + "\n")


def npm():
    require("NPM_TOKEN")
    # A temporary npm config keeps registry credentials out of the workspace.
    with tempfile.TemporaryDirectory() as scratch:
        config = Path(scratch) / "npmrc"
        config.write_text("//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n")
        config.chmod(0o600)
        for directory in [
            *(OUT / "npm" / target for target in PLATFORMS),
            OUT / "npm/cli",
        ]:
            data = json.loads((directory / "package.json").read_text())
            spec = f"{data['name']}@{data['version']}"
            # Allow a retry after a partially successful publication.
            exists = subprocess.run(
                ["npm", "view", spec, "version"],
                cwd=ROOT,
                capture_output=True,
                check=False,
                env={**os.environ, "NPM_CONFIG_USERCONFIG": str(config)},
            )
            if exists.returncode == 0:
                continue
            if b"E404" not in exists.stderr:
                raise SystemExit("Could not check npm version; publication stopped")
            run(
                "npm",
                "publish",
                str(directory),
                "--access",
                "public",
                env={**os.environ, "NPM_CONFIG_USERCONFIG": str(config)},
            )


def homebrew():
    tap = require("HOMEBREW_TAP")
    if not re.fullmatch(r"[\w.-]+/[\w.-]+", tap):
        raise SystemExit("HOMEBREW_TAP must be owner/repository")
    token = require("HOMEBREW_TAP_TOKEN")
    tag, _ = tag_version()
    import base64

    env = {**os.environ, "GH_TOKEN": token}
    endpoint = f"repos/{tap}/contents/Formula/scryr.rb"
    existing = subprocess.run(
        ["gh", "api", endpoint],
        cwd=ROOT,
        env=env,
        capture_output=True,
        text=True,
        check=False,
    )
    payload = {
        "message": f"Release Scryr {tag}",
        "content": base64.b64encode((OUT / "scryr.rb").read_bytes()).decode(),
    }
    if existing.returncode == 0:
        payload["sha"] = json.loads(existing.stdout)["sha"]
    if existing.returncode != 0 and "HTTP 404" not in existing.stderr:
        raise SystemExit("Could not read the Homebrew formula; publication stopped")
    run(
        "gh",
        "api",
        "--method",
        "PUT",
        endpoint,
        "--input",
        "-",
        input=json.dumps(payload),
        text=True,
        env=env,
    )


def preflight():
    tag_version()
    for key in [
        "GH_REPO",
        "NPM_PACKAGE_NAME",
        "NPM_TOKEN",
        "HOMEBREW_TAP",
        "HOMEBREW_TAP_TOKEN",
        "CARGO_REGISTRY_TOKEN",
    ]:
        require(key)


def crates():
    require("CARGO_REGISTRY_TOKEN")
    validate()
    # Generated assets must be in each published crate. Cargo verifies packages;
    # workspace order ensures dependencies reach the registry before dependants.
    run("mise", "run", "build:oss")
    for crate in ["crystal-core", "crystal-server", "crystal-cli"]:
        run(
            "cargo",
            "publish",
            "--locked",
            "--allow-dirty",
            "--manifest-path",
            f"crystal/{crate}/Cargo.toml",
        )


if __name__ == "__main__":
    actions = {
        fn.__name__: fn
        for fn in [
            validate,
            package,
            draft,
            prepare,
            npm,
            homebrew,
            crates,
            preflight,
        ]
    }
    actions[sys.argv[1]]()
PYTHON
'''

# Automation regression checks

[tasks."test:automation"]
description = "Test runtime isolation, migration order and release packaging"
hide = true
dir = "{{config_root}}"
run = '''
python - <<'PYTHON'
"""Regression checks for credential isolation and release/deployment boundaries."""

import hashlib
import io
import json
import os
import tarfile
import tempfile
import unittest
from pathlib import Path
from unittest.mock import patch

import sys
import tomllib
import types


def task_module(name):
    config = tomllib.loads(Path("mise.toml").read_text())
    command = config["tasks"][name + ":process"]["run"]
    body = command.split("<<'PYTHON'\n", 1)[1].rsplit("\nPYTHON", 1)[0]
    module = types.ModuleType(name)
    sys.modules[name] = module
    exec(compile(body, "mise.toml:" + name, "exec"), module.__dict__)
    return module


dev, cloud, release = (task_module(name) for name in ("dev", "cloud", "release"))


class AutomationTests(unittest.TestCase):
    def test_oss_discards_ambient_cloud_credentials(self):
        with patch.dict(
            os.environ, {key: "ambient-cloud-value" for key in dev.CLOUD_KEYS}
        ):
            env = dev.environment("oss")
        self.assertTrue(all(key not in env for key in dev.CLOUD_KEYS))
        self.assertEqual(env["AUTH_MODE"], "local")
        self.assertEqual(env["VITE_GRAPHQL_ENDPOINT"], "http://127.0.0.1:8000/graphql")

    def test_debug_writes_private_runtime_environment(self):
        with tempfile.TemporaryDirectory() as directory:
            with (
                patch.object(dev, "ROOT", Path(directory)),
                patch.object(dev.subprocess, "run"),
                patch.object(dev.sys, "argv", ["dev.py", "oss", "debug"]),
            ):
                dev.main()
            path = Path(directory) / ".cache/debug-oss.env"
            self.assertEqual(path.stat().st_mode & 0o777, 0o600)
            self.assertIn('AUTH_MODE="local"', path.read_text())
            self.assertIn('TURSO_DATABASE_URL=""', path.read_text())

    def test_cloud_requires_credentials(self):
        with patch.dict(os.environ, {}, clear=True), self.assertRaises(SystemExit):
            dev.environment("cloud")

    def test_cloud_uses_clerk_and_remote_storage(self):
        values = {key: "cloud-value" for key in dev.CLOUD_KEYS}
        with patch.dict(os.environ, values):
            env = dev.environment("cloud")
        self.assertEqual(env["AUTH_MODE"], "clerk")
        self.assertEqual(env["VITE_SCRYR_AUTH_MODE"], "clerk")
        self.assertEqual(env["TURSO_DATABASE_URL"], values["TURSO_DATABASE_URL"])
        self.assertNotIn("SCRYR_API_TOKEN", env)

    def test_deployment_error_does_not_echo_token(self):
        with (
            patch.object(
                cloud.subprocess,
                "run",
                side_effect=cloud.subprocess.CalledProcessError(
                    1, ["vercel", "deploy", "--token", "private-value"]
                ),
            ),
            self.assertRaises(SystemExit) as error,
        ):
            cloud.run("vercel", "deploy", "--token", "private-value")
        self.assertNotIn("private-value", str(error.exception))

    def test_cloud_preflight_stops_before_any_remote_call(self):
        with patch.dict(os.environ, {}, clear=True), patch.object(cloud, "run") as run:
            with self.assertRaises(SystemExit):
                cloud.main("deploy")
            run.assert_not_called()

    def test_cloud_deploy_migrates_before_fly_and_vercel(self):
        keys = [
            "FLY_API_TOKEN",
            "FLY_APP",
            "TURSO_DATABASE_URL",
            "TURSO_AUTH_TOKEN",
            "CLERK_SECRET_KEY",
            "CORS_ALLOWED_ORIGINS",
            "VERCEL_TOKEN",
            "VERCEL_ORG_ID",
            "VERCEL_PROJECT_ID",
            "VITE_CLERK_PUBLISHABLE_KEY",
        ]
        values = {key: "configured" for key in keys}
        values.update(
            CLOUD_GRAPHQL_URL="https://example.fly.dev/graphql",
            TURSO_DATABASE_URL="libsql://example.turso.io",
        )
        with patch.dict(os.environ, values), patch.object(cloud, "run") as run:
            cloud.main("deploy")
        calls = [call.args for call in run.call_args_list]
        self.assertEqual(calls[0], ("mise", "run", "build:cloud"))
        migrate = next(i for i, call in enumerate(calls) if call[-1] == "migrate")
        fly = next(
            i for i, call in enumerate(calls) if call[:2] == ("flyctl", "deploy")
        )
        vercel = next(
            i for i, call in enumerate(calls) if call[:2] == ("vercel", "deploy")
        )
        self.assertLess(migrate, fly)
        self.assertLess(fly, vercel)

    def test_release_checksums_reject_corruption(self):
        with (
            tempfile.TemporaryDirectory() as directory,
            patch.object(release, "OUT", Path(directory)),
        ):
            for target in release.PLATFORMS:
                name = f"scryr-{target}.tar.gz"
                path = Path(directory) / name
                path.write_bytes(b"binary")
                (Path(directory) / f"{name}.sha256").write_text(
                    f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {name}\n"
                )
            release.verify()
            path.write_bytes(b"corrupted")
            with self.assertRaises(SystemExit):
                release.verify()

    def test_publisher_packages_embed_verified_binary(self):
        with (
            tempfile.TemporaryDirectory() as directory,
            patch.object(release, "OUT", Path(directory)),
        ):
            for target in release.PLATFORMS:
                name = f"scryr-{target}.tar.gz"
                path = Path(directory) / name
                with tarfile.open(path, "w:gz") as archive:
                    data = b"#!/bin/sh\necho scryr 1.2.3\n"
                    member = tarfile.TarInfo("scryr")
                    member.size = len(data)
                    member.mode = 0o755
                    archive.addfile(member, io.BytesIO(data))
                (Path(directory) / f"{name}.sha256").write_text(
                    f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {name}\n"
                )
            with (
                patch.dict(
                    os.environ,
                    {
                        "RELEASE_TAG": "v1.2.3",
                        "GH_REPO": "example/scryr",
                        "NPM_PACKAGE_NAME": "@example/cli",
                    },
                ),
                patch.object(release, "run") as run,
            ):
                run.return_value.stdout = '{"isDraft": false, "isPrerelease": false}'
                release.prepare()
            wrapper = json.loads((Path(directory) / "npm/cli/package.json").read_text())
            self.assertEqual(len(wrapper["optionalDependencies"]), 4)
            for target in release.PLATFORMS:
                self.assertTrue((Path(directory) / "npm" / target / "scryr").is_file())
            formula = (Path(directory) / "scryr.rb").read_text()
            self.assertEqual(formula.count("sha256"), 4)
            self.assertIn("/releases/download/v1.2.3/", formula)


if __name__ == "__main__":
    unittest.main()
PYTHON
'''

