# Local utilities

[tasks."run:cli:samples"]
description = "Upload every sample manifest to the local GraphQL API and SQLite database"
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -eu
export SCRYR_GRAPHQL_URL="http://127.0.0.1:8000/graphql"
export SCRYR_API_TOKEN=windrunner
port=8000
health_url="http://127.0.0.1:${port}/health"
server_log="${TMPDIR:-/tmp}/scryr-sample-upload-server-${port}.log"

if ! curl --silent --show-error --fail "$health_url" >/dev/null 2>&1; then
  (
    HOST=127.0.0.1 PORT="$port" AUTH_MODE=local mise run run:server:local
  ) >"$server_log" 2>&1 &
  server_pid=$!
  trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

  if ! curl --silent --fail \
    --retry 40 \
    --retry-all-errors \
    --retry-connrefused \
    --retry-delay 1 \
    "$health_url" >/dev/null 2>&1; then
    cat "$server_log" >&2
    exit 1
  fi
fi

for sample in manifest/tests/samples/*/index.scry; do
  sample_name="$(basename "$(dirname "$sample")")"
  cargo run --locked --manifest-path crystal/Cargo.toml -p crystal-cli -- generate upload \
    --path "tests/samples/${sample_name}/index.scry" \
    --manifest-dir manifest \
    --scryr-dir "${SCRYR_DIR:-.cache/scryr}"
done
'''

[tasks."codegen-graphql-requests"]
description = "Generate frontend GraphQL types from the local server"
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -eu
token="${SCRYR_API_TOKEN:-windrunner}"

if ! curl --silent --show-error --fail \
  -H "x-scryr-token: ${token}" \
  -H "content-type: application/json" \
  --data '{"query":"query { __typename }"}' \
  http://127.0.0.1:8000/graphql >/dev/null; then
  (
    HOST=127.0.0.1 PORT=8000 AUTH_MODE=local mise run run:server:local
  ) >/tmp/scryr-codegen-server.log 2>&1 &
  server_pid=$!
  trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

  curl --silent --show-error --fail \
    --retry 40 \
    --retry-all-errors \
    --retry-connrefused \
    --retry-delay 1 \
    -H "x-scryr-token: ${token}" \
    -H "content-type: application/json" \
    --data '{"query":"query { __typename }"}' \
    http://127.0.0.1:8000/graphql >/dev/null
fi

mise run codegen:ui
'''

