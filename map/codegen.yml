overwrite: true
schema: "../crystal/crystal-server/src/graphql_schema.snapshot.graphql"
documents: "src/graphql/**/*.graphql"
generates:
  src/graphql/generated.ts:
    plugins:
      - add:
          content: "import { graphqlFetcher } from './client';"
      - "typescript"
      - "typescript-operations"
      - "typescript-react-query"
    config:
      fetcher:
        func: graphqlFetcher
        isReactHook: false
      exposeDocument: true
      exposeQueryKeys: true
      exposeFetcher: false
      addInfiniteQuery: false
      reactQueryVersion: 5
      dedupeFragments: true
      skipTypename: false
      withHooks: true
      withComponent: false
      withHOC: false
      useTypeImports: true
