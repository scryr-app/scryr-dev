query HealthCheck {
	health {
		status
		databaseOk
		databaseMessage
	}
}

query GetScryrMaps {
	scryrMaps {
		id
		key
		scryIdentifier
		name
		clerkOrgId
		orgSlug
		folderPath
		fileName
		gitCommitSha
		updatedAt
	}
}

query GetBlocks($scryIdentifier: String, $sample: String) {
	blocks(scryIdentifier: $scryIdentifier, sample: $sample) {
		manifestId
		name
		lineNumber
		consumerType
		icon
		connections
		tags
		rawJsonString
	}
}
