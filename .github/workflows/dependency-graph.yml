name: Python dependency graph

on:
  push:
    branches: [main]
    paths:
      - manifest/uv.lock
      - .github/workflows/dependency-graph.yml
      - mise.toml
      - mise.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-dependency-graph
  cancel-in-progress: false

jobs:
  submit:
    if: github.ref == 'refs/heads/main'
    name: Submit locked Python dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.9.5
          install_args: python
      - run: mise run internal:github:submit-dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
